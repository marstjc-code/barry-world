<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.5" stop-color="#0b1230"/>
      <stop offset="1" stop-color="#141b38"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="0.82" r="0.8">
      <stop offset="0" stop-color="#2e2438"/>
      <stop offset="0.5" stop-color="#161424"/>
      <stop offset="1" stop-color="#07070f"/>
    </radialGradient>
    <radialGradient id="lamp" x1="0.5" y1="0.5" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbe0"/><stop offset="0.25" stop-color="#ffe38a"/>
      <stop offset="0.5" stop-color="#ffb24a"/><stop offset="1" stop-color="#ffb24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampPink" x1="0.5" y1="0.5" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3ff"/><stop offset="0.25" stop-color="#ff9ad1"/>
      <stop offset="0.5" stop-color="#ff5ba0"/><stop offset="1" stop-color="#ff5ba0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampBlue" x1="0.5" y1="0.5" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/><stop offset="0.25" stop-color="#7fbaff"/>
      <stop offset="0.5" stop-color="#3a7bd8"/><stop offset="1" stop-color="#3a7bd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGreen" x1="0.5" y1="0.5" x2="1" y2="1">
      <stop offset="0" stop-color="#eff9e0"/><stop offset="0.25" stop-color="#a8e06a"/>
      <stop offset="0.5" stop-color="#5fa83a"/><stop offset="1" stop-color="#5fa83a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#sky)"/>
  <g fill="#cfd8ff" opacity="0.5">
    <circle cx="90" cy="70" r="1.4"/><circle cx="200" cy="40" r="1.1"/><circle cx="320" cy="90" r="1.3"/><circle cx="450" cy="50" r="1.1"/>
    <circle cx="560" cy="80" r="1.4"/><circle cx="680" cy="45" r="1.2"/><circle cx="730" cy="110" r="1.1"/><circle cx="150" cy="140" r="1.0"/>
    <circle cx="400" cy="130" r="1.0"/><circle cx="600" cy="150" r="1.2"/><circle cx="260" cy="180" r="1.0"/><circle cx="500" cy="200" r="1.0"/>
  </g>
  <path d="M0 320 C160 300 300 312 400 302 C520 292 640 308 800 292 L800 800 L0 800 Z" fill="url(#floorGlow)"/>
  <g fill="#1c2418" opacity="0.5">
    <circle cx="120" cy="360" r="2"/><circle cx="250" cy="350" r="2"/><circle cx="400" cy="365" r="2"/><circle cx="560" cy="355" r="2"/>
    <circle cx="700" cy="360" r="2"/><circle cx="80" cy="430" r="2"/><circle cx="300" cy="440" r="2"/><circle cx="480" cy="425" r="2"/>
  </g>
  <!-- corner lamps -->
  <line x1="120" y1="345" x2="120" y2="395" stroke="#5a3a1a" stroke-width="4"/>
  <circle cx="120" cy="345" r="34" fill="url(#lamp)" opacity="0.9"/><circle cx="120" cy="345" r="7" fill="#fff3c0"/>
  <line x1="680" y1="345" x2="680" y2="395" stroke="#1a2a3a" stroke-width="4"/>
  <circle cx="680" cy="345" r="34" fill="url(#lampBlue)" opacity="0.9"/><circle cx="680" cy="345" r="7" fill="#cfeaff"/>
  <line x1="150" y1="640" x2="150" y2="688" stroke="#3a1a2a" stroke-width="4"/>
  <circle cx="150" cy="640" r="42" fill="url(#lampPink)" opacity="0.9"/><circle cx="150" cy="640" r="8" fill="#ffe8ff"/>
  <line x1="660" y1="640" x2="660" y2="688" stroke="#1a2a1a" stroke-width="4"/>
  <circle cx="660" cy="640" r="42" fill="url(#lampGreen)" opacity="0.9"/><circle cx="660" cy="640" r="8" fill="#e8f8d8"/>
  <!-- checkerboard -->
  <g>
    <rect x="330" y="402" width="45" height="11" fill="#e8e6e0"/><rect x="375" y="402" width="45" height="11" fill="#15131f"/>
    <rect x="420" y="402" width="45" height="11" fill="#e8e6e0"/><rect x="465" y="402" width="45" height="11" fill="#15131f"/>
    <rect x="510" y="402" width="45" height="11" fill="#e8e6e0"/><rect x="555" y="402" width="45" height="11" fill="#15131f"/>
    <rect x="322" y="415" width="49" height="13" fill="#15131f"/><rect x="371" y="415" width="49" height="13" fill="#e8e6e0"/>
    <rect x="420" y="415" width="49" height="13" fill="#15131f"/><rect x="469" y="415" width="49" height="13" fill="#e8e6e0"/>
    <rect x="518" y="415" width="49" height="13" fill="#15131f"/><rect x="567" y="415" width="49" height="13" fill="#e8e6e0"/>
    <rect x="313" y="430" width="53" height="15" fill="#e8e6e0"/><rect x="366" y="430" width="53" height="15" fill="#15131f"/>
    <rect x="419" y="430" width="53" height="15" fill="#e8e6e0"/><rect x="472" y="430" width="53" height="15" fill="#15131f"/>
    <rect x="525" y="430" width="53" height="15" fill="#e8e6e0"/><rect x="578" y="430" width="53" height="15" fill="#15131f"/>
    <rect x="303" y="448" width="58" height="17" fill="#15131f"/><rect x="361" y="448" width="58" height="17" fill="#e8e6e0"/>
    <rect x="419" y="448" width="58" height="17" fill="#15131f"/><rect x="477" y="448" width="58" height="17" fill="#e8e6e0"/>
    <rect x="535" y="448" width="58" height="17" fill="#15131f"/><rect x="593" y="448" width="58" height="17" fill="#e8e6e0"/>
    <rect x="292" y="468" width="63" height="19" fill="#e8e6e0"/><rect x="355" y="468" width="63" height="19" fill="#15131f"/>
    <rect x="418" y="468" width="63" height="19" fill="#e8e6e0"/><rect x="481" y="468" width="63" height="19" fill="#15131f"/>
    <rect x="544" y="468" width="63" height="19" fill="#e8e6e0"/><rect x="607" y="468" width="63" height="19" fill="#15131f"/>
    <rect x="280" y="490" width="69" height="21" fill="#15131f"/><rect x="349" y="490" width="69" height="21" fill="#e8e6e0"/>
    <rect x="418" y="490" width="69" height="21" fill="#15131f"/><rect x="487" y="490" width="69" height="21" fill="#e8e6e0"/>
    <rect x="556" y="490" width="69" height="21" fill="#15131f"/><rect x="625" y="490" width="69" height="21" fill="#e8e6e0"/>
    <rect x="266" y="514" width="76" height="23" fill="#e8e6e0"/><rect x="342" y="514" width="76" height="23" fill="#15131f"/>
    <rect x="418" y="514" width="76" height="23" fill="#e8e6e0"/><rect x="494" y="514" width="76" height="23" fill="#15131f"/>
    <rect x="570" y="514" width="76" height="23" fill="#e8e6e0"/><rect x="646" y="514" width="76" height="23" fill="#15131f"/>
  </g>
  <!-- DJ booth, bigger, behind the floor far end -->
  <rect x="340" y="338" width="220" height="52" fill="#0d0d16"/>
  <rect x="340" y="338" width="220" height="9" fill="#d8a83a"/>
  <rect x="352" y="352" width="196" height="34" fill="#161624"/>
  <rect x="360" y="358" width="180" height="22" fill="#202034"/>
  <text x="450" y="354" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#f2e6c9" text-anchor="middle">DJ BARRY — THE RUB</text>
  <circle cx="350" cy="345" r="4" fill="#ff5ba0"/><circle cx="550" cy="345" r="4" fill="#5ba8ff"/>
  <!-- hand-painted sign, in front of the floor -->
  <g transform="translate(292 548) rotate(-3)">
    <rect x="0" y="0" width="280" height="62" rx="4" fill="#6a2a1a"/>
    <rect x="5" y="5" width="270" height="52" rx="3" fill="none" stroke="#e8c37a" stroke-width="2"/>
    <text x="140" y="28" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffe3a0" text-anchor="middle">DANCE FLOOR</text>
    <text x="140" y="50" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffe3a0" text-anchor="middle">— RHYTHM INSIDE</text>
  </g>
  <rect x="425" y="610" width="7" height="48" fill="#2a1a12"/>
  <!-- PEA the real dog, in FRONT of the sign, on the floor -->
  <g transform="translate(440 660)">
    <!-- tail curled -->
    <path d="M -52 40 C -70 28 -76 12 -66 4 C -56 -2 -46 4 -48 12 Z" fill="#c99a58" stroke="#7a5a2a" stroke-width="2"/>
    <!-- back (hump) -->
    <path d="M -40 44 C -30 16 20 12 50 24 C 66 32 70 44 58 52 C 30 62 -20 60 -40 44 Z" fill="#b88a4a" stroke="#7a5a2a" stroke-width="2.5"/>
    <!-- chest -->
    <path d="M -40 44 C -52 48 -56 58 -50 68 C -34 72 -20 68 -12 58 C -8 50 -12 40 -20 36 Z" fill="#c99a58" stroke="#7a5a2a" stroke-width="2"/>
    <!-- head -->
    <circle cx="-72" cy="40" r="26" fill="#c99a58" stroke="#7a5a2a" stroke-width="2"/>
    <!-- snout -->
    <ellipse cx="-92" cy="48" rx="18" ry="14" fill="#e0b878" stroke="#7a5a2a" stroke-width="2"/>
    <!-- nose -->
    <circle cx="-106" cy="46" r="5" fill="#2a1a0a"/>
    <!-- closed eye -->
    <path d="M -82 32 C -85 37 -88 37 -90 32" fill="none" stroke="#4a301a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- mouth line -->
    <path d="M -104 56 C -96 60 -88 60 -82 56" fill="none" stroke="#7a5a2a" stroke-width="2" stroke-linecap="round"/>
    <!-- ear flopped -->
    <path d="M -68 16 C -76 10 -80 4 -74 0 C -66 2 -62 8 -68 16 Z" fill="#8a5a2a" stroke="#5a3a1a" stroke-width="2"/>
    <!-- inner ear -->
    <path d="M -72 12 C -78 8 -80 5 -76 3 C -70 4 -68 9 -72 12 Z" fill="#5a3a1a"/>
    <!-- paws -->
    <ellipse cx="-42" cy="66" rx="9" ry="6" fill="#b88a4a" stroke="#7a5a2a" stroke-width="2"/>
    <ellipse cx="-18" cy="70" rx="9" ry="6" fill="#b88a4a" stroke="#7a5a2a" stroke-width="2"/>
    <ellipse cx="20" cy="66" rx="9" ry="6" fill="#b88a4a" stroke="#7a5a2a" stroke-width="2"/>
    <ellipse cx="46" cy="70" rx="9" ry="6" fill="#b88a4a" stroke="#7a5a2a" stroke-width="2"/>
    <!-- front leg shadows -->
    <ellipse cx="-30" cy="74" rx="22" ry="5" fill="#07070f" opacity="0.5"/>
    <ellipse cx="28" cy="74" rx="22" ry="5" fill="#07070f" opacity="0.5"/>
  </g>
  <!-- BIG PLATE: pie, foreground centre, higher into frame -->
  <g transform="translate(300 740)">
    <ellipse cx="0" cy="0" rx="150" ry="40" fill="#f2ead8" stroke="#c8b898" stroke-width="3"/>
    <ellipse cx="0" cy="-4" rx="135" ry="34" fill="#e8d8b8"/>
    <ellipse cx="0" cy="-8" rx="70" ry="22" fill="#b86a3a" stroke="#7a3a1a" stroke-width="3"/>
    <ellipse cx="0" cy="-12" rx="64" ry="18" fill="#c97a4a"/>
    <!-- pie lattice -->
    <path d="M -52 -8 L 0 -16 L 52 -8" fill="none" stroke="#7a3a1a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -48 2 L 0 -4 L 48 2" fill="none" stroke="#7a3a1a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -44 10 L 0 6 L 44 10" fill="none" stroke="#7a3a1a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- steam -->
    <path d="M -12 -28 C -16 -38 -10 -46 -14 -56" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <path d="M 10 -26 C 14 -36 8 -44 12 -54" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  </g>
  <!-- corner tag -->
  <g transform="translate(40 760)">
    <rect x="0" y="0" width="200" height="26" rx="3" fill="#1a2a1a" stroke="#5fa83a" stroke-width="1.5"/>
    <text x="100" y="18" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#a8e06a" text-anchor="middle">GIVE IT A GOOD OLD RUB</text>
  </g>
</svg>