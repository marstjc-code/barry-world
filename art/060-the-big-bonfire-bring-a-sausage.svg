<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fireGlow" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#ffe8c4"/>
      <stop offset="18%" stop-color="#ffb04c"/>
      <stop offset="42%" stop-color="#e85a20"/>
      <stop offset="70%" stop-color="#3a2a18" opacity="0.6"/>
      <stop offset="100%" stop-color="#161226" opacity="0"/>
    </radialGradient>
    <radialGradient id="fireCore" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#fff3c8"/>
      <stop offset="35%" stop-color="#ffd05e"/>
      <stop offset="70%" stop-color="#ff7a2a"/>
      <stop offset="100%" stop-color="#b83a14"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4a4550" opacity="0.55"/>
      <stop offset="100%" stop-color="#4a4550" opacity="0"/>
    </linearGradient>
  </defs>

  <!-- NIGHT SKY -->
  <rect width="800" height="520" fill="#0e0a18"/>
  <rect width="800" height="420" fill="#131024" opacity="0.7"/>
  <!-- stars -->
  <circle cx="120" cy="80" r="1.5" fill="#e8e8e8"/>
  <circle cx="240" cy="50" r="1" fill="#c8c8c8"/>
  <circle cx="330" cy="90" r="1.8" fill="#e8e8e8"/>
  <circle cx="470" cy="60" r="1.2" fill="#c8c8c8"/>
  <circle cx="600" cy="95" r="1.6" fill="#e8e8e8"/>
  <circle cx="700" cy="55" r="1" fill="#c8c8c8"/>
  <circle cx="160" cy="140" r="1.2" fill="#c8c8c8"/>
  <circle cx="560" cy="130" r="1.4" fill="#e8e8e8"/>
  <circle cx="660" cy="150" r="1" fill="#c8c8c8"/>
  <circle cx="80" cy="200" r="1.3" fill="#c8c8c8"/>
  <!-- moon small top-left -->
  <circle cx="70" cy="70" r="16" fill="#e8e3d0"/>
  <circle cx="60" cy="64" r="14" fill="#0e0a18" opacity="0.25"/>

  <!-- GROUND -->
  <rect x="0" y="420" width="800" height="100" fill="#1a140e"/>
  <rect x="0" y="420" width="800" height="4" fill="#2a2016"/>

  <!-- firelight pool on the ground -->
  <ellipse cx="400" cy="452" rx="230" ry="56" fill="#e85a20" opacity="0.28"/>
  <ellipse cx="400" cy="448" rx="150" ry="40" fill="#ff9a4c" opacity="0.4"/>

  <!-- SMOKES -->
  <path d="M400 250 C420 210 390 180 410 150 C430 120 410 100 420 70" stroke="url(#smoke)" stroke-width="18" fill="none" opacity="0.7"/>
  <path d="M400 260 C380 220 400 190 385 160 C370 130 385 110 375 80" stroke="url(#smoke)" stroke-width="14" fill="none" opacity="0.5"/>
  <path d="M400 255 C425 215 405 185 430 155 C450 125 435 105 445 75" stroke="url(#smoke)" stroke-width="12" fill="none" opacity="0.45"/>

  <!-- THE FIRE: logs -->
  <rect x="330" y="428" width="150" height="18" fill="#4a3018" stroke="#2a180c" stroke-width="4"/>
  <rect x="320" y="414" width="160" height="18" fill="#5a3a1a" stroke="#2a180c" stroke-width="4"/>
  <rect x="310" y="400" width="180" height="18" fill="#4a2a12" stroke="#2a180c" stroke-width="4"/>

  <!-- flames -->
  <ellipse cx="400" cy="380" rx="95" ry="95" fill="url(#fireGlow)"/>
  <path d="M400 400 C360 340 375 290 395 265 C415 300 440 285 450 240 C440 285 435 320 400 340 C365 330 380 310 400 400 Z"
        fill="url(#fireCore)" opacity="0.9"/>
  <path d="M400 395 C380 350 392 315 400 295 C412 320 418 300 425 275 C415 300 410 325 400 350 Z"
        fill="#fff3c8" opacity="0.85"/>
  <!-- embers -->
  <circle cx="360" cy="410" r="3" fill="#ff9a4c"/>
  <circle cx="440" cy="415" r="3" fill="#ff9a4c"/>
  <circle cx="385" cy="420" r="2" fill="#ffb34c"/>
  <circle cx="415" cy="422" r="2" fill="#ff7a2a"/>

  <!-- SIGN POST in front, hand-painted real word -->
  <rect x="612" y="250" width="14" height="180" fill="#3a2818" stroke="#2a180c" stroke-width="3"/>
  <rect x="592" y="252" width="74" height="110" fill="#e8d8a8" stroke="#5a4a28" stroke-width="4"/>
  <!-- sign text, hand-painted -->
  <text x="632" y="280" font-family="Courier New" font-size="26" font-weight="bold" fill="#2a180c" text-anchor="middle">THE</text>
  <text x="632" y="312" font-family="Courier New" font-size="26" font-weight="bold" fill="#2a180c" text-anchor="middle">BIG</text>
  <text x="632" y="344" font-family="Courier New" font-size="20" font-weight="bold" fill="#c93a2e" text-anchor="middle">BONFIRE</text>
  <text x="632" y="372" font-family="Courier New" font-size="16" font-weight="bold" fill="#2a180c" text-anchor="middle">BRING</text>
  <text x="632" y="388" font-family="Courier New" font-size="16" font-weight="bold" fill="#2a180c" text-anchor="middle">A SAUSAGE</text>

  <!-- warm spill across the whole scene -->
  <rect width="800" height="520" fill="#e85a20" opacity="0.06"/>
</svg>