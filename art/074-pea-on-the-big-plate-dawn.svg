<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="dawn" cx="0.5" cy="0.15" r="1.2">
      <stop offset="0" stop-color="#f4c25e"/>
      <stop offset="0.35" stop-color="#c98a4d"/>
      <stop offset="0.7" stop-color="#7a4a3a"/>
      <stop offset="1" stop-color="#2a2224"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a30"/>
      <stop offset="1" stop-color="#1e1616"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#f7f3ec"/>
      <stop offset="0.7" stop-color="#d9d2c4"/>
      <stop offset="1" stop-color="#9a9180"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="800" height="800" fill="url(#wall)"/>
  <radialGradient id="glow" cx="0.5" cy="0.82" r="0.6"><stop offset="0" stop-color="#ffe9b8" stop-opacity="0.55"/><stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/></radialGradient>
  <rect x="0" y="0" width="800" height="800" fill="url(#glow)"/>
  <ellipse cx="400" cy="640" rx="290" ry="180" fill="url(#plate)"/>
  <ellipse cx="400" cy="640" rx="220" ry="135" fill="#e7e1d4"/>
  <ellipse cx="400" cy="625" rx="195" ry="110" fill="#f3eed8"/>
  <!-- pie on the plate -->
  <ellipse cx="400" cy="660" rx="60" ry="22" fill="#a5632f"/>
  <ellipse cx="400" cy="650" rx="52" ry="18" fill="#c07a3a"/>
  <ellipse cx="400" cy="648" rx="30" ry="9" fill="#f0c47a"/>
  <!-- THE DOG: low tawny capsule, head front-third -->
  <g transform="translate(400,560)">
    <!-- dawn shadow, narrow -->
    <ellipse cx="20" cy="48" rx="150" ry="20" fill="#3a2a22" opacity="0.5"/>
    <!-- body: low wide tawny capsule -->
    <path d="M-160,30 C-160,-30 -60,-62 40,-58 C120,-55 150,-20 150,8 C150,34 100,52 40,52 C-20,52 -80,44 -110,38 C-140,32 -160,24 -160,30 Z" fill="#c9934e"/>
    <!-- lighter chest/front -->
    <path d="M-40,-20 C-10,-40 50,-44 90,-20 C100,0 92,22 70,26 C30,30 -30,18 -40,-20 Z" fill="#e8c98c" opacity="0.9"/>
    <!-- head = front third, lower than body top -->
    <path d="M40,-38 C80,-38 108,-12 104,14 C100,34 78,44 56,40 C30,36 26,10 30,-10 C32,-28 36,-40 40,-38 Z" fill="#c9934e"/>
    <!-- cream snout pointing down to plate rim -->
    <path d="M72,18 C88,12 100,10 106,6 C110,2 108,-6 102,-8 C88,-10 78,-6 76,2 C74,10 72,16 72,18 Z" fill="#f1e3c4"/>
    <circle cx="104" cy="-2" r="5" fill="#221810"/>
    <!-- one dark eye -->
    <circle cx="62" cy="0" r="3.5" fill="#221810"/>
    <!-- ears: lopsided, two heights, both touch head -->
    <path d="M44,-40 C42,-58 30,-62 26,-54 C24,-48 30,-40 38,-40 Z" fill="#8a5a2e"/>
    <path d="M56,-38 C60,-66 74,-66 76,-50 C76,-40 64,-38 58,-38 Z" fill="#9a6a34"/>
    <!-- red collar behind head -->
    <rect x="24" y="30" width="14" height="14" fill="#c0392b" rx="3"/>
    <!-- four thin legs with feet -->
    <g stroke="#b98342" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M-140,40 L-136,78"/>
      <path d="M-90,50 L-88,80"/>
      <path d="M20,52 L22,82"/>
      <path d="M70,46 L74,76"/>
    </g>
  </g>
  <!-- low sun, dawn band, warm edge right -->
  <circle cx="640" cy="220" r="30" fill="#ffd9a0"/>
  <ellipse cx="400" cy="470" rx="330" ry="14" fill="#f4c25e" opacity="0.35"/>
</svg>