<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow90" cx="45%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="50%" stop-color="#ffaa3c"/>
      <stop offset="100%" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon90" cx="42%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="100%" stop-color="#c8d4e8"/>
    </radialGradient>
  </defs>
  <!-- night -->
  <rect width="800" height="600" fill="#0c1220"/>
  <!-- small moon -->
  <circle cx="660" cy="110" r="30" fill="url(#moon90)"/>
  <!-- warm pool, the lamp, tighter -->
  <ellipse cx="380" cy="330" rx="220" ry="140" fill="url(#glow90)"/>
  <!-- the paper: tilted, pinned at top, taped corner bottom-left -->
  <g transform="translate(380,330) rotate(-5)">
    <rect x="-155" y="-120" width="310" height="240" fill="#f6f1e4" stroke="#e8dcc4" stroke-width="2"/>
    <!-- pin at top centre -->
    <circle cx="0" cy="-120" r="6" fill="#c8102e"/>
    <circle cx="0" cy="-120" r="3" fill="#1a1210"/>
    <line x1="0" y1="-120" x2="0" y2="-135" stroke="#c8102e" stroke-width="2"/>
    <!-- tape at bottom-left corner -->
    <rect x="-155" y="100" width="34" height="12" fill="#d9c8a5" opacity="0.7" transform="rotate(10 -140 105)"/>
  </g>
  <!-- the child's drawing on the paper -->
  <g transform="translate(380,330) rotate(-5)">
    <!-- two big round eyes, pupils off-centre -->
    <circle cx="-30" cy="-45" r="20" fill="#fff8dc" stroke="#4a2c15" stroke-width="3"/>
    <circle cx="-30" cy="-42" r="7" fill="#1a1210"/>
    <circle cx="30" cy="-45" r="20" fill="#fff8dc" stroke="#4a2c15" stroke-width="3"/>
    <circle cx="32" cy="-42" r="7" fill="#1a1210"/>
    <!-- nose: just a squiggle -->
    <path d="M -6 -18 q -8 10 0 16 q 8 -6 4 -14" stroke="#8b5a30" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- smile: too wide -->
    <path d="M -30 12 q 30 26 60 12" stroke="#4a2c15" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- the ENORMOUS moustache: two tumbling crayon lumps -->
    <path d="M -10 8 Q -60 38 -140 30 Q -150 10 -95 0 Z" fill="#b5793c" stroke="#4a2c15" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 10 8 Q 60 38 140 30 Q 150 10 95 0 Z" fill="#b5793c" stroke="#4a2c15" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- Pea, the REAL dog, sitting under the paper's lower-right edge -->
  <g transform="translate(560,505)">
    <!-- body -->
    <ellipse cx="0" cy="10" rx="62" ry="40" fill="#d8c8a8"/>
    <!-- tail, low, flicking up -->
    <path d="M -62 12 q -22 -12 -10 -34 q 6 -8 14 0 q -6 26 4 16 Z" fill="#d8c8a8"/>
    <!-- head -->
    <ellipse cx="42" cy="-18" rx="38" ry="34" fill="#d8c8a8"/>
    <!-- ears, real, on the side of the head -->
    <path d="M 22 -48 q -6 -30 14 -32 q 4 30 -6 40 Z" fill="#c8b088"/>
    <path d="M 62 -48 q 6 -30 -14 -32 q -4 30 6 40 Z" fill="#c8b088"/>
    <!-- muzzle -->
    <ellipse cx="42" cy="8" rx="24" ry="18" fill="#ecd8b4"/>
    <!-- nose -->
    <path d="M 42 2 q -10 -8 0 -16 q 10 8 0 16 Z" fill="#4a2c15"/>
    <!-- eyes -->
    <circle cx="26" cy="-22" r="5" fill="#1a1210"/>
    <circle cx="58" cy="-22" r="5" fill="#1a1210"/>
  </g>
  <!-- hand-written note -->
  <g transform="translate(210,545) rotate(10)">
    <text x="0" y="0" font-family="'Comic Sans MS','Comic Sans','Segoe Print',cursive" font-size="26" fill="#fff3c4">for Barry</text>
  </g>
  <!-- the one real word, hand-painted, bottom-right near Pea -->
  <g transform="translate(660,545) rotate(-6)">
    <rect x="-70" y="-16" width="140" height="32" fill="#ffaa3c" stroke="#1a1210" stroke-width="4"/>
    <text x="0" y="11" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#1a1210" text-anchor="middle">FOR BARRY</text>
  </g>
</svg>