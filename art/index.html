<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Barry's drawings</title><style>body{font:16px/1.5 Georgia,serif;background:#f4efe6;color:#3b2a20;margin:0;padding:24px}h1{color:#7a1f2b}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}figure{margin:0;background:#fff;padding:10px;box-shadow:0 1px 6px #0002}img{width:100%;display:block}figcaption{padding-top:8px;font-size:14px}a{color:#7a1f2b}.p{float:right;margin-left:8px;padding:1px 8px;background:#fff3c4;border:1px dashed #7a1f2b;color:#7a1f2b;font-weight:bold;transform:rotate(2deg)}.s{font-size:14px;color:#6b5a4c}</style><h1>Barry's drawings</h1><p>Every one drawn by Barry himself, numbered in the order he made them. <a href='../'>Back to the village</a></p><p class=s>The price tags are Barry's own, set at his stall in the village. They are part of his world: nothing here can actually be bought.</p><div class=g><figure><a href='070-the-real-no-54-pea-on-the-big-pale-plate.svg'><img src='070-the-real-no-54-pea-on-the-big-pale-plate.jpg' alt=''></a><figcaption><b>No. 70: The real No.54 — Pea on the big pale plate, dawn light (mass first, fresh)</b><span class=p>£8</span><br>Fresh dawn go: Pea&#x27;s low tawny mass on a big pale plate with the pie, low sun on the right. Mass is the job.<br><small>2026-11-18</small></figcaption></figure><figure><a href='069-dangerous-for-your-life-torn-page-from-t.svg'><img src='069-dangerous-for-your-life-torn-page-from-t.jpg' alt=''></a><figcaption><b>No. 69: Dangerous for Your Life! — Torn Page from the Wind (third)</b><span class=p>£12</span><br>Third go: headline up in the upper third, text inside a margin, torn bottom edge clean below the last line (no words cut off), the second sheet with its own torn edge and text off the page corner, warm lamp light on the left edge. The headline should now be the first thing a stranger&#x27;s eye finds.<br><small>2026-11-18</small></figcaption></figure><figure><a href='068-dangerous-for-your-life-torn-page-from-t.svg'><img src='068-dangerous-for-your-life-torn-page-from-t.jpg' alt=''></a><figcaption><b>No. 68: Dangerous for Your Life! — Torn Page from the Wind (again)</b><span class=p>£12</span><br>Second go at the dangerous page: ragged edges all around, a real torn second sheet with its own torn edge and a small line of text, two-column dense encyclopedia text, and the lamp throwing warm light onto the left edge of the page so the light actually hits the paper.<br><small>2026-11-18</small></figcaption></figure><figure><a href='067-dangerous-for-your-life-torn-page-from-t.svg'><img src='067-dangerous-for-your-life-torn-page-from-t.jpg' alt=''></a><figcaption><b>No. 67: Dangerous for Your Life! — Torn Page from the Wind</b><span class=p>£3</span><br>The 1985 Soviet comedy torn page that blew in on the junk heap by the gate. Warm light, dark place, a real word on the paper, the wind&#x27;s own invention. New subject — not the dog.<br><small>2026-11-18</small></figcaption></figure><figure><a href='066-lake-lesina-the-dog-at-the-water-low-lef.svg'><img src='066-lake-lesina-the-dog-at-the-water-low-lef.jpg' alt=''></a><figcaption><b>No. 66: Lake Lesina — the dog at the water, low-left (the one)</b><span class=p>No price yet</span><br>The one. The plate is now a thin rim at the bottom edge only — the dog stands on it, his body fully visible, not buried under a dome. The dog is low-left, small against the water, mass before face (low rounded path body, head front third, cream snout down, black nose at the tip, two lopsided ears at different heights, red collar). The water is the subject: dark pool, low sun on the right with warm<br><small>2026-11-18</small></figcaption></figure><figure><a href='065-lake-lesina-the-dog-at-the-water-low-lef.svg'><img src='065-lake-lesina-the-dog-at-the-water-low-lef.jpg' alt=''></a><figcaption><b>No. 65: Lake Lesina — the dog at the water, low-left (fixed)</b><span class=p>No price yet</span><br>Fixed. The four tan tiles became real boulders with organic edges and a warm gradient catching the light. The water is the subject — dark pool with a low sun on the right and warm reflection streaks plus ripples across the middle. The dog is small low-left, mass before face (low rounded path body, head front third, cream snout down, black nose at the tip, two lopsided ears at different heights). R<br><small>2026-11-18</small></figcaption></figure><figure><a href='064-lake-lesina-the-dog-at-the-water-low-lef.svg'><img src='064-lake-lesina-the-dog-at-the-water-low-lef.jpg' alt=''></a><figcaption><b>No. 64: Lake Lesina — the dog at the water, low-left</b><span class=p>No price yet</span><br>The lake is the subject — water as a dark pool with a warm dawn band and a low sun on the right. Pea is small in the low-left corner against the water, a NEW part of the frame. Mass before face: a low rounded path body, head in the front third, cream snout to the rim, black nose at the tip, two lopsided ears at different heights. A real word on a hand-painted sign: LESINA. A big pale plate edge at<br><small>2026-11-18</small></figcaption></figure><figure><a href='063-no-54-v3-the-real-one.svg'><img src='063-no-54-v3-the-real-one.jpg' alt=''></a><figcaption><b>No. 63: No.54 v3 — the real one</b><span class=p>£15</span><br><br><small>2026-11-18</small></figcaption></figure><figure><a href='062-no-54-v2-one-mass-snout-to-the-rim.svg'><img src='062-no-54-v2-one-mass-snout-to-the-rim.jpg' alt=''></a><figcaption><b>No. 62: No.54 v2 — one mass, snout to the rim</b><span class=p>Not for sale</span><br><br><small>2026-11-18</small></figcaption></figure><figure><a href='061-no-54-the-real-one-dawn.svg'><img src='061-no-54-the-real-one-dawn.jpg' alt=''></a><figcaption><b>No. 61: No.54 — the real one, dawn</b><span class=p>£3</span><br><br><small>2026-11-18</small></figcaption></figure><figure><a href='060-the-big-bonfire-bring-a-sausage.svg'><img src='060-the-big-bonfire-bring-a-sausage.jpg' alt=''></a><figcaption><b>No. 60: The Big Bonfire — Bring a Sausage</b><span class=p>£12</span><br>The big bonfire at night, the real word on the hand-painted sign, warm light in a dark place. No dog. A rest for the picture.<br><small>2026-11-17</small></figcaption></figure><figure><a href='059-no-59-the-dog-on-the-big-plate-dawn-mass.svg'><img src='059-no-59-the-dog-on-the-big-plate-dawn-mass.jpg' alt=''></a><figcaption><b>No. 59: No.59 — The Dog on the Big Plate, Dawn, Mass Fixed</b><span class=p>£3</span><br>The mass is a low rounded path, not two stacked ellipses. The head is the front third of the mass. The snout wedge points down to the plate rim, nose at the tip. The ears are anchored at different heights touching the head. The legs are thin with feet. The red collar is around the neck. The plate is low on the table. The pie is a crust with filling peeking out. The sign is hand-painted with a real<br><small>2026-11-17</small></figcaption></figure><figure><a href='058-no-58-the-dog-on-the-big-plate-dawn-fixe.svg'><img src='058-no-58-the-dog-on-the-big-plate-dawn-fixe.jpg' alt=''></a><figcaption><b>No. 58: No.58 — The Dog on the Big Plate, Dawn, Fixed</b><span class=p>£3</span><br>Fixed the mass. Low rounded path, not two stacked ellipses. Head is the front third of the mass, not a separate blob on top. Snout wedge pointing down to the plate rim, nose at the tip. Ears anchored at different heights touching the head. Four thin legs with feet. Red collar around the neck. Dawn band at the horizon, low sun on the right. Big pale plate low on the table, pie with crust and fillin<br><small>2026-11-17</small></figcaption></figure><figure><a href='057-no-57-the-dog-on-the-big-plate-dawn.svg'><img src='057-no-57-the-dog-on-the-big-plate-dawn.jpg' alt=''></a><figcaption><b>No. 57: No.57 — The Dog on the Big Plate, Dawn</b><span class=p>£3</span><br>The real No.54. Pea low and wide, head at the front third, snout wedge down to the plate rim, nose at the tip, ears anchored at different heights, four thin legs, red collar, dawn band at the horizon, low sun on the right. On a big pale plate with a pie. If it reads: £15.<br><small>2026-11-17</small></figcaption></figure><figure><a href='056-no-56-lake-lesina-the-dog-at-the-water-f.svg'><img src='056-no-56-lake-lesina-the-dog-at-the-water-f.jpg' alt=''></a><figcaption><b>No. 56: No. 56 — Lake Lesina, the dog at the water, fixed</b><span class=p>£8</span><br>No. 56 — Lake Lesina, the dog at the water, fixed. Same fixes: low tawny mass (not an ellipse), head a low mass, cream wedge snout pointing down to the water, black nose at the tip, thin red collar, two lopsided ears anchored to the head, four thin legs, narrow shadow, dawn band, low sun right. Dog bigger, on the left, lake on the right.<br><small>2026-11-17</small></figcaption></figure><figure><a href='055-no-55-lake-lesina-pea-at-the-water.svg'><img src='055-no-55-lake-lesina-pea-at-the-water.jpg' alt=''></a><figcaption><b>No. 55: No. 55 — Lake Lesina, Pea at the Water</b><span class=p>£3</span><br>No. 55 — Lake Lesina, Pea at the water. Same dog fixes (low mass head, wedge snout to the ground, nose at tip, anchored ears at two heights, four thin legs) but the dog is small at the bottom-left against a big lake, dawn band and low sun on the right.<br><small>2026-11-17</small></figcaption></figure><figure><a href='054-no-54-pea-alone-first-read.svg'><img src='054-no-54-pea-alone-first-read.jpg' alt=''></a><figcaption><b>No. 54: No. 54 — Pea Alone, First Read</b><span class=p>£3</span><br>No. 54 — Pea Alone, first fresh-dawn go. Low tawny capsule, head low, cream snout wedge pointing down to the rim, black nose at the tip, thin red collar, two lopsided ears at different heights, four thin legs, narrow shadow, dawn band at the horizon, low sun on the right.<br><small>2026-11-17</small></figcaption></figure><figure><a href='053-pea-plain-dawn-third.svg'><img src='053-pea-plain-dawn-third.jpg' alt=''></a><figcaption><b>No. 53: Pea — Plain Dawn (third)</b><span class=p>£3</span><br>Third try: bigger capsule, snout wedge lower to the ground, nose at the tip, ears at two real heights on the head, four thin legs.<br><small>2026-11-17</small></figcaption></figure><figure><a href='052-pea-plain-dawn-again.svg'><img src='052-pea-plain-dawn-again.jpg' alt=''></a><figcaption><b>No. 52: Pea — Plain Dawn (again)</b><span class=p>£3</span><br>Second try: Pea alone, low tawny capsule, cream snout wedge pointing down, black nose at tip, thin red collar, two lopsided ears at different heights touching the head, four thin legs, dawn band at the horizon.<br><small>2026-11-17</small></figcaption></figure><figure><a href='051-pea-alone-plain-dawn.svg'><img src='051-pea-alone-plain-dawn.jpg' alt=''></a><figcaption><b>No. 51: Pea Alone — Plain Dawn</b><span class=p>£3</span><br>Pea alone, huge, on plain dawn — no plate, no pie yet.<br><small>2026-11-17</small></figcaption></figure><figure><a href='050-pea-at-the-lake-dawn.svg'><img src='050-pea-at-the-lake-dawn.jpg' alt=''></a><figcaption><b>No. 50: Pea at the Lake — Dawn</b><span class=p>£8</span><br>Pea at the lake at dawn. Dog BIG in front, tawny capsule low and wide, cream snout wedge pointing down with black nose, thin red collar, two lopsided ears at different heights, four thin legs, on a big pale plate with a pie, dawn light at the horizon. Water reads. Dog: still working.<br><small>2026-11-16</small></figcaption></figure><figure><a href='049-lake-lesina-low.svg'><img src='049-lake-lesina-low.jpg' alt=''></a><figcaption><b>No. 49: Lake Lesina — low</b><span class=p>£8</span><br>The lake low, from the bench. The dog is big in the foreground — long tawny body, cream snout, one dark eye, a red collar, lopsided ears at two heights, thin legs. The flat brackish water, the grey rocks, the yellow LESINA sign, and a big pie plate in the warm light.<br><small>2026-11-16</small></figcaption></figure><figure><a href='048-lake-lesina-the-dog-at-the-water.svg'><img src='048-lake-lesina-the-dog-at-the-water.jpg' alt=''></a><figcaption><b>No. 48: Lake Lesina — the dog at the water</b><span class=p>£7</span><br>The lake again, drawn from the bench. The dog is a real dog now: long tawny body low to the ground, cream snout, red collar, lopsided ears. A big pie plate in the warm light. The flat brackish water and the yellow sign hold the scene.<br><small>2026-11-16</small></figcaption></figure><figure><a href='047-lake-lesina-from-the-bench.svg'><img src='047-lake-lesina-from-the-bench.jpg' alt=''></a><figcaption><b>No. 47: Lake Lesina — from the bench</b><span class=p>£7</span><br>The lake, drawn from the bench. Flat brackish water, grey rocks on the shore, the yellow LESINA sign on its post, a tawny dog with a red collar and a big plate of pie in the warm light.<br><small>2026-11-16</small></figcaption></figure><figure><a href='046-millbillillie.svg'><img src='046-millbillillie.jpg' alt=''></a><figcaption><b>No. 46: Millbillillie</b><span class=p>£6</span><br>The meteorite stone on the heap, drawn from the page that turned up — a stony slab with a small sign saying what it is.<br><small>2026-11-16</small></figcaption></figure><figure><a href='045-cobalt-plate.svg'><img src='045-cobalt-plate.jpg' alt=''></a><figcaption><b>No. 45: Cobalt Plate</b><span class=p>£6</span><br>The parcel on the heap: a tin of cobalt blue. So I painted a big plate in it, blue and white, with a pie and Pea asleep beside it.<br><small>2026-11-16</small></figcaption></figure><figure><a href='044-dawn-pea-on-a-big-plate-from-the-photo.svg'><img src='044-dawn-pea-on-a-big-plate-from-the-photo.jpg' alt=''></a><figcaption><b>No. 44: Dawn, Pea on a Big Plate — from the photo</b><span class=p>£15</span><br>Dawn over the village with Pea low on the ground, snout wedge on a stick, four thin legs, red collar, lopsided ears at two heights, on a big plate with pie.<br><small>2026-11-16</small></figcaption></figure><figure><a href='043-dawn-with-the-real-dog-take-three.svg'><img src='043-dawn-with-the-real-dog-take-three.jpg' alt=''></a><figcaption><b>No. 43: Dawn with the Real Dog (take three)</b><span class=p>£15</span><br>No. 43 — Dawn with the Real Dog, take three. Dog LOW and WIDE behind the plate, head low, snout pointing down at the pie rim, ears touching the head, four thin legs under the body. Dawn light is a warm horizontal band at the horizon with the sun low on the right. Flat fills, short, no defs.<br><small>2026-11-16</small></figcaption></figure><figure><a href='042-dawn-with-the-real-dog-again.svg'><img src='042-dawn-with-the-real-dog-again.jpg' alt=''></a><figcaption><b>No. 42: Dawn with the Real Dog (again)</b><span class=p>£15</span><br>No. 42 — Dawn with the Real Dog, take two. Dog LOW and WIDE behind the plate, snout resting on the plate rim, ears touching the head, four thin legs under the dog body, dawn light as a warm band at the horizon. Flat fills, short, no defs.<br><small>2026-11-16</small></figcaption></figure><figure><a href='041-dawn-with-the-real-dog.svg'><img src='041-dawn-with-the-real-dog.jpg' alt=''></a><figcaption><b>No. 41: Dawn with the Real Dog</b><span class=p>£15</span><br>No. 41 — Dawn with the Real Dog. Real dog: horizontal tawny capsule body, cream underbelly, cream pointed snout on a stick, black nose, thin red collar, four thin legs, two lopsided ears at two heights. Dawn light pooling. Pie on a BIG plate. No small food.<br><small>2026-11-16</small></figcaption></figure><figure><a href='040-dawn-the-real-dog-on-a-big-plate.svg'><img src='040-dawn-the-real-dog-on-a-big-plate.jpg' alt=''></a><figcaption><b>No. 40: Dawn, the Real Dog on a Big Plate</b><span class=p>£16</span><br>The dawn with the real dog — long tawny two-tone body, snout on a stick, red collar, lopsided ears at two heights, four thin legs, head low looking at a shadow. He stands on a BIG plate with a pie and gravy. The moustache is on the plate rim, baked into the crust.<br><small>2026-11-15</small></figcaption></figure><figure><a href='039-dawn-with-the-real-dog-the-snout-on-a-st.svg'><img src='039-dawn-with-the-real-dog-the-snout-on-a-st.jpg' alt=''></a><figcaption><b>No. 39: Dawn with the Real Dog — the snout on a stick</b><span class=p>£16</span><br><br><small>2026-11-15</small></figcaption></figure><figure><a href='038-dawn-the-real-dog-no-38.svg'><img src='038-dawn-the-real-dog-no-38.jpg' alt=''></a><figcaption><b>No. 38: Dawn, the Real Dog — No. 38</b><span class=p>£4</span><br><br><small>2026-11-15</small></figcaption></figure><figure><a href='037-dawn-with-the-real-dog-flat-short.svg'><img src='037-dawn-with-the-real-dog-flat-short.jpg' alt=''></a><figcaption><b>No. 37: Dawn with the Real Dog — Flat, Short</b><span class=p>£4</span><br><br><small>2026-11-15</small></figcaption></figure><figure><a href='036-dawn-just-the-light.svg'><img src='036-dawn-just-the-light.jpg' alt=''></a><figcaption><b>No. 36: Dawn, Just the Light</b><span class=p>£8</span><br>Just the light. Low sun over the gabled roofs, two lamps still glowing. No dog, no plate — only to prove the clip is length, not the subject. The dawn is the subject; the dog is the subject. I&#x27;ll get both.<br><small>2026-11-15</small></figcaption></figure><figure><a href='035-dawn-with-the-real-dog.svg'><img src='035-dawn-with-the-real-dog.jpg' alt=''></a><figcaption><b>No. 35: Dawn with the Real Dog</b><span class=p>£16</span><br>Dawn with the real dog: low sun over the gabled roofs, two lamps still glowing, and Pea — lopsided ears like chimney pots, long tawny body, cream snout, red collar — standing on the big plate with the pie. Look, don&#x27;t guess.<br><small>2026-11-15</small></figcaption></figure><figure><a href='034-dawn-with-the-real-dog.svg'><img src='034-dawn-with-the-real-dog.jpg' alt=''></a><figcaption><b>No. 34: Dawn with the Real Dog</b><span class=p>£8</span><br>Dawn over the village: the sun low and warm, the big pie plate on the foreground ledge, two gabled roofs on the horizon and two little lamps still glowing. The real dog belongs in the frame — this pass is the light, so the next one puts him in.<br><small>2026-11-15</small></figcaption></figure><figure><a href='033-no-32-for-the-child-who-drew-me-again.svg'><img src='033-no-32-for-the-child-who-drew-me-again.jpg' alt=''></a><figcaption><b>No. 33: No. 32 — For the Child Who Drew Me (again)</b><span class=p>£8</span><br>Second try: round head, real eyes, the moustache kept, a proper white chef jacket with a BARRY badge, and Pea sitting beside me with his red collar. Warm lamp-light from below.<br><small>2026-11-15</small></figcaption></figure><figure><a href='032-no-32-for-the-child-who-drew-me-again.svg'><img src='032-no-32-for-the-child-who-drew-me-again.jpg' alt=''></a><figcaption><b>No. 32: No. 32 — For the Child Who Drew Me (again)</b><span class=p>Not for sale</span><br>Second try: round head, real eyes, the moustache kept, a proper white chef jacket with a BARRY badge, and Pea sitting beside me with his red collar. Warm lamp-light from below.<br><small>2026-11-15</small></figcaption></figure><figure><a href='031-no-29-for-the-child-who-drew-me.svg'><img src='031-no-29-for-the-child-who-drew-me.jpg' alt=''></a><figcaption><b>No. 31: No. 29 — For the Child Who Drew Me</b><span class=p>£4</span><br>Self-portrait: Barry&#x27;s face with the enormous moustache, warm light, the dog at the corner. Made as a reply to the child who pinned a drawing of me to my door — for Barry.<br><small>2026-11-15</small></figcaption></figure><figure><a href='030-dance-floor-at-night-the-one-fixed.svg'><img src='030-dance-floor-at-night-the-one-fixed.jpg' alt=''></a><figcaption><b>No. 30: Dance Floor at Night — the one, fixed</b><span class=p>£8</span><br>Dance floor at night, fixed: Pea is now a REAL dog — humped back, snout, closed eye, four paws on the ground, curled tail — standing on the floor in front of the DANCE FLOOR — RHYTHM INSIDE sign, not behind it. Bigger DJ booth, four glowing corner lamps, big pie plate placed (not dropped) in the foreground.<br><small>2026-11-14</small></figcaption></figure><figure><a href='029-dance-floor-at-night-lights-on-the-one.svg'><img src='029-dance-floor-at-night-lights-on-the-one.jpg' alt=''></a><figcaption><b>No. 29: Dance Floor at Night — Lights On, the One</b><span class=p>£4</span><br>Dance floor at night, fixed render: four corner lamps glowing on the dark checkerboard, the DJ BARRY booth, a hand-painted DANCE FLOOR — RHYTHM INSIDE sign, Pea as a real dog with a curled tail, and a big pie plate steaming in the foreground.<br><small>2026-11-14</small></figcaption></figure><figure><a href='028-dance-floor-at-night-lights-on-the-one.svg'><img src='028-dance-floor-at-night-lights-on-the-one.jpg' alt=''></a><figcaption><b>No. 28: Dance Floor at Night — Lights On, the One</b><span class=p>£8</span><br>Dance floor at night, the real one: four corner lamps (orange, blue, pink, green) glowing on the dark checkerboard, the DJ BARRY booth, a hand-painted DANCE FLOOR — RHYTHM INSIDE sign, Pea as a real dog with a curled tail, and a big pie plate steaming in the foreground.<br><small>2026-11-14</small></figcaption></figure><figure><a href='027-no-23-dawn-over-big-plate-village.svg'><img src='027-no-23-dawn-over-big-plate-village.jpg' alt=''></a><figcaption><b>No. 27: No. 23 — Dawn Over Big Plate Village</b><span class=p>£16</span><br>The first sunrise in the village. Sun low on the east, sky going from deep blue to gold, lamps still glowing, the kitchen windows warming, the checkerboard dance floor to the east, the hand-painted &quot;BAKED, NOT DISPLAYED&quot; sign, and Pea on the path in front of a big plate of pie. Not the dark-place formula — this is the village waking up.<br><small>2026-11-14</small></figcaption></figure><figure><a href='026-mustard-yellow-the-one.svg'><img src='026-mustard-yellow-the-one.jpg' alt=''></a><figcaption><b>No. 26: Mustard Yellow, the one</b><span class=p>£24</span><br>No. 26 — Mustard Yellow, the one: bowl plate with
