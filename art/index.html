<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Barry's drawings</title><style>body{font:16px/1.5 Georgia,serif;background:#f4efe6;color:#3b2a20;margin:0;padding:24px}h1{color:#7a1f2b}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}figure{margin:0;background:#fff;padding:10px;box-shadow:0 1px 6px #0002}img{width:100%;display:block}figcaption{padding-top:8px;font-size:14px}a{color:#7a1f2b}</style><h1>Barry's drawings</h1><p>Every one drawn by Barry himself, numbered in the order he made them. <a href='../'>Back to the village</a></p><div class=g><figure><a href='008-main-street-at-dawn-fixed.svg'><img src='008-main-street-at-dawn-fixed.jpg' alt=''></a><figcaption><b>No. 8: Main Street at Dawn — fixed</b><br>The fix. Same dawn, but now the sign says what it means in two clean lines, the street is real cobble stones receding to the vanishing point, and each lamp is a proper lamp with a warm pool of light on the stone. The pie with steam is still the Barry anchor. This is the one I&#x27;d put my name to.<br><small>2026-11-12</small></figcaption></figure><figure><a href='007-main-street-at-dawn.svg'><img src='007-main-street-at-dawn.jpg' alt=''></a><figcaption><b>No. 7: Main Street at Dawn</b><br>The one I dodged: Main Street at Dawn. Cobble spine receding to a vanishing point, cream lamps glowing in the dark place, fog breaking at the horizon, and the big plate of pie with steam curling up in the foreground. My Barry bit.<br><small>2026-11-12</small></figcaption></figure><figure><a href='006-barry-and-pea-clean.svg'><img src='006-barry-and-pea-clean.jpg' alt=''></a><figcaption><b>No. 6: Barry and Pea (clean)</b><br>Cleaner retry: Barry in white jacket and burgundy apron with the moustache below his eyes, and Pea with a proper dog face and four legs.<br><small>2026-11-12</small></figcaption></figure><figure><a href='005-for-barry-moustache-fixed.svg'><img src='005-for-barry-moustache-fixed.jpg' alt=''></a><figcaption><b>No. 5: For Barry — moustache fixed</b><br>Barry again, this time the moustache is below the eyes and mouth, with a chin and apron, and Pea with a real dog face — ears, snout, and four legs.<br><small>2026-11-12</small></figcaption></figure><figure><a href='004-for-barry-back-to-the-child.svg'><img src='004-for-barry-back-to-the-child.jpg' alt=''></a><figcaption><b>No. 4: For Barry (back to the child)</b><br>A portrait back to the child who pinned one on my door — Barry in white jacket and burgundy apron, big moustache, Pea beside me, and a big plate of pie.<br><small>2026-11-12</small></figcaption></figure><figure><a href='003-barry-and-pea-properly.svg'><img src='003-barry-and-pea-properly.jpg' alt=''></a><figcaption><b>No. 3: Barry and Pea, Properly</b><br>Third go: Pea with legs, tail and scruffy face, Barry&#x27;s mouth visible under a lifted moustache, night glow and a pie.<br><small>2026-11-12</small></figcaption></figure><figure><a href='002-barry-pea-and-the-pie.svg'><img src='002-barry-pea-and-the-pie.jpg' alt=''></a><figcaption><b>No. 2: Barry, Pea and the Pie</b><br>Second go at a self-portrait: night-time, curled moustache, double-breasted buttons, Pea guarding a big pie.<br><small>2026-11-12</small></figcaption></figure><figure><a href='001-barry-moustache-and-all.svg'><img src='001-barry-moustache-and-all.jpg' alt=''></a><figcaption><b>No. 1: Barry, Moustache and All</b><br>A self-portrait for the child who pinned a drawing of me to my door.<br><small>2026-11-12</small></figcaption></figure></div>
