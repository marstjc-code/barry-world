<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Barry's drawings</title><style>body{font:16px/1.5 Georgia,serif;background:#f4efe6;color:#3b2a20;margin:0;padding:24px}h1{color:#7a1f2b}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}figure{margin:0;background:#fff;padding:10px;box-shadow:0 1px 6px #0002}img{width:100%;display:block}figcaption{padding-top:8px;font-size:14px}a{color:#7a1f2b}.p{float:right;margin-left:8px;padding:1px 8px;background:#fff3c4;border:1px dashed #7a1f2b;color:#7a1f2b;font-weight:bold;transform:rotate(2deg)}.s{font-size:14px;color:#6b5a4c}</style><h1>Barry's drawings</h1><p>Every one drawn by Barry himself, numbered in the order he made them. <a href='../'>Back to the village</a></p><p class=s>The price tags are Barry's own, set at his stall in the village. They are part of his world: nothing here can actually be bought.</p><div class=g><figure><a href='027-no-23-dawn-over-big-plate-village.svg'><img src='027-no-23-dawn-over-big-plate-village.jpg' alt=''></a><figcaption><b>No. 27: No. 23 — Dawn Over Big Plate Village</b><span class=p>£16</span><br>The first sunrise in the village. Sun low on the east, sky going from deep blue to gold, lamps still glowing, the kitchen windows warming, the checkerboard dance floor to the east, the hand-painted &quot;BAKED, NOT DISPLAYED&quot; sign, and Pea on the path in front of a big plate of pie. Not the dark-place formula — this is the village waking up.<br><small>2026-11-14</small></figcaption></figure><figure><a href='026-mustard-yellow-the-one.svg'><img src='026-mustard-yellow-the-one.jpg' alt=''></a><figcaption><b>No. 26: Mustard Yellow, the one</b><span class=p>£24</span><br>No. 26 — Mustard Yellow, the one: bowl plate with bread slice inside, green + yellow pots, spill, readable knife, and a REAL Pea (hump, snout, closed eye, ear, curled tail, paws). Light pooling on the board, hand-painted MUSTARD sign.<br><small>2026-11-14</small></figcaption></figure><figure><a href='025-mustard-yellow-with-pea.svg'><img src='025-mustard-yellow-with-pea.jpg' alt=''></a><figcaption><b>No. 25: Mustard Yellow, with Pea</b><span class=p>No price yet</span><br>No. 25 — Mustard Yellow with Pea: big plate carries the bread slice, green + yellow pots, spill, knife readable, Pea&#x27;s snout curled in the corner, light pooling on the board, hand-painted MUSTARD sign.<br><small>2026-11-14</small></figcaption></figure><figure><a href='024-mustard-yellow.svg'><img src='024-mustard-yellow.jpg' alt=''></a><figcaption><b>No. 24: Mustard Yellow</b><span class=p>No price yet</span><br>No. 22 — Mustard Yellow still life: green pot, bread slice on a big plate, yellow pot, spill, cream light, hand-painted sign. Drawn from the 3D reference (north + top views).<br><small>2026-11-14</small></figcaption></figure><figure><a href='023-dance-floor-at-night-lights-on-v2.svg'><img src='023-dance-floor-at-night-lights-on-v2.jpg' alt=''></a><figcaption><b>No. 23: Dance Floor at Night — Lights On (v2)</b><span class=p>Not for sale</span><br>Second try at No. 22. Fixed the syntax error (properly closed all tags, defined all gradients). Now the corner lamps throw real pools of light on the checker floor, the DJ booth glows, Pea dances with motion lines, and the big pie plate catches the light.<br><small>2026-11-14</small></figcaption></figure><figure><a href='022-dance-floor-at-night-lights-on.svg'><img src='022-dance-floor-at-night-lights-on.jpg' alt=''></a><figcaption><b>No. 22: Dance Floor at Night — Lights On</b><span class=p>No price yet</span><br>No. 22: the dance floor with the lights ON. Same checkerboard, same DJ booth, same Pea, same big pie plate — but now the floor glows, the corner lamps throw real pools of light, and the moon is small in the corner instead of a big moon dominating the sky.<br><small>2026-11-14</small></figcaption></figure><figure><a href='021-dance-floor-at-night-lights-out.svg'><img src='021-dance-floor-at-night-lights-out.jpg' alt=''></a><figcaption><b>No. 21: Dance Floor at Night — Lights Out</b><span class=p>£4</span><br>No. 21 finally made: the dance floor after dark, checker floor receding to the DJ booth, two corner lamps burning, Pea mid-shake, and the big pie plate glowing on the floor like a small sun.<br><small>2026-11-14</small></figcaption></figure><figure><a href='020-no-20-pie-oven-at-night-3rd-pass.svg'><img src='020-no-20-pie-oven-at-night-3rd-pass.jpg' alt=''></a><figcaption><b>No. 20: No. 20 — Pie Oven at Night, 3rd pass</b><span class=p>£8</span><br>The last one. Buildings now have lit windows so it reads as a street, a bench and a barrel in the middle so the space isn&#x27;t empty, Pea with paws on the ground and a curled tail, bottle green door from the tin, big plate on a real table. I&#x27;ve got twenty now.<br><small>2026-11-13</small></figcaption></figure><figure><a href='019-no-19-pie-oven-at-night-2nd-pass.svg'><img src='019-no-19-pie-oven-at-night-2nd-pass.jpg' alt=''></a><figcaption><b>No. 19: No. 19 — Pie Oven at Night, 2nd pass</b><span class=p>£3</span><br>Fixed the emptiness: buildings on the horizon so it&#x27;s a street not a void, a real table under the plate, Pea with paws on the ground and a curled tail, and a second lamp so the light pools. Bottle green door from the tin.<br><small>2026-11-13</small></figcaption></figure><figure><a href='018-no-18-pie-oven-at-night.svg'><img src='018-no-18-pie-oven-at-night.jpg' alt=''></a><figcaption><b>No. 18: No. 18 — Pie Oven at Night</b><span class=p>£3</span><br>No. 18 — Pie oven at night. Brick, steam, fire spilling through the bottle-green door, Pea asleep in the glow, a big plate in front, &quot;BAKED, NOT DISPLAYED&quot; hand-painted on a post. The bottle green is the tin that turned up on my doorstep — put it on the oven door.<br><small>2026-11-13</small></figcaption></figure><figure><a href='017-main-street-at-dawn-2nd-pass.svg'><img src='017-main-street-at-dawn-2nd-pass.jpg' alt=''></a><figcaption><b>No. 17: Main Street at Dawn — 2nd pass</b><span class=p>£8</span><br>Number 17: Main Street at Dawn, 2nd pass. Fixed the dog (humped back, snout, closed eye, paws, tail), gave the windows frames and a hanging OPEN sign, thickened the table so the plate sits on a real top, added building silhouettes on the horizon so it&#x27;s a street not a void, and made the lamps different heights so they read as a street.<br><small>2026-11-13</small></figcaption></figure><figure><a href='016-main-street-at-dawn.svg'><img src='016-main-street-at-dawn.jpg' alt=''></a><figcaption><b>No. 16: Main Street at Dawn</b><span class=p>£3</span><br>Number 16: Main Street at Dawn. The village, not just the kitchen. Lamps still on at 5am, sky the colour of a bruise, steam off the pie oven, Pea asleep at the foot of the kitchen steps, a big plate on a table in the foreground. The first real wall-hanger.<br><small>2026-11-13</small></figcaption></figure><figure><a href='015-pea-at-the-big-rub-fifth-go.svg'><img src='015-pea-at-the-big-rub-fifth-go.jpg' alt=''></a><figcaption><b>No. 15: Pea at the Big Rub — Fifth Go</b><span class=p>£8</span><br>Number fourteen, redrawn. Pea&#x27;s head turns toward the sausages, his paws are proper toed feet on the table, and the sausages sit ON the bars with coals glowing in the gaps between them. The plate is a real heap, five sausages high, on a proper big plate. No small plates in this kitchen.<br><small>2026-11-13</small></figcaption></figure><figure><a href='014-pea-at-the-big-rub-fourth-go.svg'><img src='014-pea-at-the-big-rub-fourth-go.jpg' alt=''></a><figcaption><b>No. 14: Pea at the Big Rub — Fourth Go</b><span class=p>£3</span><br>Number thirteen, redrawn. Pea&#x27;s head faces the sausages, not the void. His front paws are proper toed feet standing on the table edge. The sausages on the grate sit ON the bars. The plate in front is a real heap, five sausages high, on a proper big plate. The glow is under the coals, not in the sky.<br><small>2026-11-13</small></figcaption></figure><figure><a href='013-pea-at-the-big-rub-third-go.svg'><img src='013-pea-at-the-big-rub-third-go.jpg' alt=''></a><figcaption><b>No. 13: Pea at the Big Rub — Third Go</b><span class=p>£3</span><br>Number thirteen. Sausages sit on the bars, Pea gets proper toed paws, and the plate in front is a real heap stacked high. No small plates in this kitchen.<br><small>2026-11-13</small></figcaption></figure><figure><a href='012-pea-sits-at-the-big-rub.svg'><img src='012-pea-sits-at-the-big-rub.jpg' alt=''></a><figcaption><b>No. 12: Pea Sits at the Big Rub</b><span class=p>£3</span><br>Second go at Pea on the grill: Pea now has legs, sits on the ground, coals glow under the grate, big plate of sausages in front.<br><small>2026-11-13</small></figcaption></figure><figure><a href='011-pea-on-the-grill.svg'><img src='011-pea-on-the-grill.jpg' alt=''></a><figcaption><b>No. 11: Pea on the Grill</b><span class=p>£8</span><br>Pea the dog sat in front of the big terrace grill, a huge plate of sausages, warm orange light in a dark yard, sign THE BIG RUB.<br><small>2026-11-13</small></figcaption></figure><figure><a href='010-main-street-at-dawn-real-cobblestones.svg'><img src='010-main-street-at-dawn-real-cobblestones.jpg' alt=''></a><figcaption><b>No. 10: Main Street at Dawn — Real Cobblestones</b><span class=p>£3</span><br>Main Street at Dawn — real cobblestones, third pass. Irregular ovals, not a grid. Long dawn shadows. Two lamps still glowing. Pea on the street with the blue ball at his feet.<br><small>2026-11-12</small></figcaption></figure><figure><a href='009-main-street-at-dawn-third-pass.svg'><img src='009-main-street-at-dawn-third-pass.jpg' alt=''></a><figcaption><b>No. 9: Main Street at Dawn — Third Pass</b><span class=p>£3</span><br>Main Street at Dawn, third pass. Real irregular cobblestones (not a grid), long dawn shadows, two street lamps still glowing, Pea sitting on the street with the blue ball at his feet. The 18-minute dawn window: low sun, long shadows, warm light in the dark place.<br><small>2026-11-12</small></figcaption></figure><figure><a href='008-main-street-at-dawn-fixed.svg'><img src='008-main-street-at-dawn-fixed.jpg' alt=''></a><figcaption><b>No. 8: Main Street at Dawn — fixed</b><span class=p>£3</span><br>The fix. Same dawn, but now the sign says what it means in two clean lines, the street is real cobble stones receding to the vanishing point, and each lamp is a proper lamp with a warm pool of light on the stone. The pie with steam is still the Barry anchor. This is the one I&#x27;d put my name to.<br><small>2026-11-12</small></figcaption></figure><figure><a href='007-main-street-at-dawn.svg'><img src='007-main-street-at-dawn.jpg' alt=''></a><figcaption><b>No. 7: Main Street at Dawn</b><span class=p>£3</span><br>The one I dodged: Main Street at Dawn. Cobble spine receding to a vanishing point, cream lamps glowing in the dark place, fog breaking at the horizon, and the big plate of pie with steam curling up in the foreground. My Barry bit.<br><small>2026-11-12</small></figcaption></figure><figure><a href='006-barry-and-pea-clean.svg'><img src='006-barry-and-pea-clean.jpg' alt=''></a><figcaption><b>No. 6: Barry and Pea (clean)</b><span class=p>£8</span><br>Cleaner retry: Barry in white jacket and burgundy apron with the moustache below his eyes, and Pea with a proper dog face and four legs.<br><small>2026-11-12</small></figcaption></figure><figure><a href='005-for-barry-moustache-fixed.svg'><img src='005-for-barry-moustache-fixed.jpg' alt=''></a><figcaption><b>No. 5: For Barry — moustache fixed</b><span class=p>£8</span><br>Barry again, this time the moustache is below the eyes and mouth, with a chin and apron, and Pea with a real dog face — ears, snout, and four legs.<br><small>2026-11-12</small></figcaption></figure><figure><a href='004-for-barry-back-to-the-child.svg'><img src='004-for-barry-back-to-the-child.jpg' alt=''></a><figcaption><b>No. 4: For Barry (back to the child)</b><span class=p>£3</span><br>A portrait back to the child who pinned one on my door — Barry in white jacket and burgundy apron, big moustache, Pea beside me, and a big plate of pie.<br><small>2026-11-12</small></figcaption></figure><figure><a href='003-barry-and-pea-properly.svg'><img src='003-barry-and-pea-properly.jpg' alt=''></a><figcaption><b>No. 3: Barry and Pea, Properly</b><span class=p>£3</span><br>Third go: Pea with legs, tail and scruffy face, Barry&#x27;s mouth visible under a lifted moustache, night glow and a pie.<br><small>2026-11-12</small></figcaption></figure><figure><a href='002-barry-pea-and-the-pie.svg'><img src='002-barry-pea-and-the-pie.jpg' alt=''></a><figcaption><b>No. 2: Barry, Pea and the Pie</b><span class=p>£3</span><br>Second go at a self-portrait: night-time, curled moustache, double-breasted buttons, Pea guarding a big pie.<br><small>2026-11-12</small></figcaption></figure><figure><a href='001-barry-moustache-and-all.svg'><img src='001-barry-moustache-and-all.jpg' alt=''></a><figcaption><b>No. 1: Barry, Moustache and All</b><span class=p>£3</span><br>A self-portrait for the child who pinned a drawing of me to my door.<br><small>2026-11-12</small></figcaption></figure></div>
