    <path d="
      M-170,-190
      C-215,-110 -215,30 -165,130
      C-115,205 -25,225 70,195
      C165,165 215,55 205,-50
      C195,-165 120,-240 25,-240
      C-70,-240 -170,-190 -170,-190 Z

      M-45,-90
      C-95,-135 -95,-25 -55,25
      C-15,65 35,60 55,20
      C75,-25 45,-110 -10,-135
      C-45,-150 -95,-135 -45,-90 Z
    "
      fill="#f2e8c8"/>
  </g>

  <text x="400" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#9a8a70">dead in Seoul, alive in Jeju</text>

  <rect x="70" y="615" width="660" height="55" fill="#d8cbb0" stroke="#4a3a20" stroke-width="3"/>
