<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="dark" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0%" stop-color="#161a26"/>
      <stop offset="100%" stop-color="#0b0d18"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f2e8c8" stop-opacity="0.45"/>
