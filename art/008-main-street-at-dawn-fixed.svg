<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16243c"/>
      <stop offset="0.4" stop-color="#3c4a6e"/>
      <stop offset="0.72" stop-color="#c97a4b"/>
      <stop offset="1" stop-color="#f3b77a"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e3d0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f6e7d6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#efe0cf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ff9d2e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#e8e0d0"/>
    </linearGradient>
    <linearGradient id="pie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3b167"/>
      <stop offset="1" stop-color="#c98a3e"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="800" fill="url(#sky)"/>
  <!-- low sun, off-centre, warm -->
  <circle cx="360" cy="298" r="24" fill="#ffe6bd"/>
  <circle cx="360" cy="298" r="44" fill="#ffcb8e" opacity="0.4"/>
  <circle cx="360" cy="298" r="70" fill="#ff9d2e" opacity="0.18"/>

  <!-- distant building silhouettes, fading -->
  <g fill="#262d42">
    <rect x="70" y="270" width="110" height="62"/>
    <rect x="220" y="258" width="140" height="74"/>
    <rect x="410" y="264" width="130" height="68"/>
    <rect x="560" y="272" width="150" height="58"/>
  </g>
  <g fill="#31394f" opacity="0.7">
    <rect x="140" y="290" width="95" height="42"/>
    <rect x="500" y="292" width="85" height="44"/>
  </g>
  <!-- little windows lit in the dark buildings -->
  <g fill="#ffd9a8" opacity="0.9">
    <rect x="160" y="296" width="7" height="9"/>
    <rect x="178" y="296" width="7" height="9"/>
    <rect x="250" y="280" width="7" height="9"/>
    <rect x="520" y="300" width="7" height="9"/>
    <rect x="538" y="300" width="7" height="9"/>
    <rect x="600" y="292" width="7" height="9"/>
  </g>

  <!-- fog band with breaks -->
  <rect x="0" y="278" width="800" height="100" fill="url(#fog)"/>
  <path d="M0 292 Q140 304 280 296 T560 298 T800 292 L800 304 L0 304 Z" fill="#f6e7d6" opacity="0.55"/>
  <path d="M0 308 Q180 298 380 306 T800 300 L800 322 L0 322 Z" fill="#efe0cf" opacity="0.45"/>

  <!-- cobblestone street, real stones, receding to (400,300) -->
  <polygon points="235,800 565,800 470,520 330,520" fill="#6b5f3f"/>
  <g stroke="#3a3020" stroke-opacity="0.75" stroke-width="1.6" fill="none">
    <polygon points="235,800 565,800 470,520 330,520"/>
    <!-- vertical cobbles (receding lines) -->
    <line x1="310" y1="800" x2="388" y2="520"/>
    <line x1="400" y1="800" x2="400" y2="520"/>
    <line x1="490" y1="800" x2="412" y2="520"/>
    <line x1="565" y1="800" x2="470" y2="520"/>
    <!-- horizontal cobbles (receding rows) -->
    <line x1="245" y1="780" x2="555" y2="780"/>
    <line x1="255" y1="740" x2="545" y2="740"/>
    <line x1="266" y1="696" x2="534" y2="696"/>
    <line x1="277" y1="648" x2="523" y2="648"/>
    <line x1="288" y1="596" x2="512" y2="596"/>
    <line x1="299" y1="544" x2="501" y2="544"/>
  </g>
  <!-- warm light catching the right-side cobbles -->
  <polygon points="400,800 565,800 470,520 420,560" fill="#c99a5a" opacity="0.5"/>
  <polygon points="330,800 400,800 400,740 338,752" fill="#b98a4a" opacity="0.4"/>

  <!-- street lamps down the left, each a proper lamp with glow -->
  <g>
    <!-- near lamp -->
    <g>
      <rect x="212" y="520" width="11" height="230" fill="#343434"/>
      <rect x="212" y="468" width="11" height="52" fill="#2e2e2e"/>
      <path d="M194 468 Q217 448 240 468" stroke="#2e2e2e" stroke-width="6" fill="none"/>
      <circle cx="194" cy="466" r="10" fill="#262626" stroke="#8a6f4a" stroke-width="2"/>
      <circle cx="240" cy="466" r="10" fill="#262626" stroke="#8a6f4a" stroke-width="2"/>
      <circle cx="194" cy="466" r="6" fill="#ffd9a8"/>
      <circle cx="240" cy="466" r="6" fill="#ffd9a8"/>
      <circle cx="217" cy="466" r="52" fill="url(#lampGlow)"/>
      <ellipse cx="217" cy="722" rx="60" ry="15" fill="#ffb46e" opacity="0.32"/>
    </g>
    <!-- mid lamp -->
    <g transform="translate(246,0) scale(0.72)">
      <rect x="212" y="520" width="11" height="230" fill="#343434"/>
      <path d="M194 468 Q217 448 240 468" stroke="#2e2e2e" stroke-width="6" fill="none"/>
      <circle cx="194" cy="466" r="10" fill="#262626"/>
      <circle cx="240" cy="466" r="10" fill="#262626"/>
      <circle cx="194" cy="466" r="6" fill="#ffd9a8"/>
      <circle cx="240" cy="466" r="6" fill="#ffd9a8"/>
      <circle cx="217" cy="466" r="40" fill="url(#lampGlow)"/>
    </g>
    <!-- far lamp -->
    <g transform="translate(272,0) scale(0.5)">
      <rect x="212" y="520" width="11" height="230" fill="#343434"/>
      <path d="M194 468 Q217 448 240 468" stroke="#2e2e2e" stroke-width="6" fill="none"/>
      <circle cx="194" cy="466" r="10" fill="#262626"/>
      <circle cx="240" cy="466" r="10" fill="#262626"/>
      <circle cx="194" cy="466" r="6" fill="#ffd9a8"/>
      <circle cx="240" cy="466" r="6" fill="#ffd9a8"/>
    </g>
  </g>

  <!-- the sign: real words, two clean lines -->
  <g>
    <rect x="488" y="430" width="10" height="200" fill="#3a2e1e"/>
    <rect x="481" y="430" width="8" height="200" fill="#3a2e1e"/>
    <rect x="428" y="380" width="194" height="56" rx="10" fill="#7a2f1f" stroke="#3a150e" stroke-width="4"/>
    <rect x="437" y="389" width="176" height="38" rx="5" fill="#f3e3d0"/>
    <text x="525" y="404" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7a2f1f" letter-spacing="1">BIG PLATE VILLAGE</text>
    <text x="525" y="422" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7a2f1f" letter-spacing="1">COME HUNGRY</text>
  </g>

  <!-- big plate of pie, foreground left, steam -->
  <g transform="translate(155,645)">
    <ellipse cx="0" cy="42" rx="150" ry="26" fill="#2a2216" opacity="0.45"/>
    <ellipse cx="0" cy="34" rx="150" ry="30" fill="url(#plate)" stroke="#c9bfa8" stroke-width="3"/>
    <ellipse cx="0" cy="30" rx="122" ry="24" fill="#e8d9b0"/>
    <ellipse cx="0" cy="26" rx="95" ry="20" fill="url(#pie)"/>
    <ellipse cx="0" cy="23" rx="86" ry="16" fill="#d99a52"/>
    <path d="M-60 12 Q-40 2 -20 12 T20 10 T60 14" stroke="#8a6a3a" stroke-width="2.4" fill="none" opacity="0.85"/>
    <circle cx="-42" cy="24" r="2.4" fill="#8a6a3a"/>
    <circle cx="0" cy="20" r="2.4" fill="#8a6a3a"/>
    <circle cx="42" cy="24" r="2.4" fill="#8a6a3a"/>
    <!-- steam, rising and breaking -->
    <g stroke="#ffffff" stroke-width="4" fill="none" stroke-opacity="0.55" stroke-linecap="round">
      <path d="M-22 0 Q-34 -30 -18 -55 Q-2 -78 -14 -100"/>
      <path d="M16 -4 Q28 -34 14 -58 Q4 -80 12 -102"/>
      <path d="M-2 -4 Q-10 -28 -4 -52"/>
    </g>
  </g>

  <!-- hand word bottom right -->
  <text x="736" y="772" font-family="Georgia, serif" font-size="19" fill="#f3e3d0" transform="rotate(-4 736 772)">Barry's — 12 Nov 2026</text>
</svg>