<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="fog" cx="55%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e9e2d2"/>
      <stop offset="45%" stop-color="#cfd4d6"/>
      <stop offset="100%" stop-color="#9aa3a6"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e8a9e"/>
      <stop offset="60%" stop-color="#547086"/>
      <stop offset="100%" stop-color="#44586b"/>
    </linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a6e54"/>
      <stop offset="100%" stop-color="#4d4431"/>
    </linearGradient>
  </defs>
  <!-- sky / fog -->
  <rect width="800" height="800" fill="url(#fog)"/>
  <!-- distant bank line, faint -->
  <rect x="0" y="330" width="800" height="46" fill="#b9b2a6" opacity="0.55"/>
  <!-- lake: water as the subject, open blue centre, north -->
  <path d="M 60 368 Q 400 330 740 368 L 740 560 Q 400 585 60 560 Z" fill="url(#water)"/>
  <!-- low fog sheet hugging the far bank -->
  <path d="M 60 368 Q 400 330 740 368 L 740 412 Q 400 384 60 412 Z" fill="#dde4e4" opacity="0.72"/>
  <!-- mid fog band across the water -->
  <path d="M 0 470 Q 400 452 800 470 L 800 512 Q 400 494 0 512 Z" fill="#d6dde0" opacity="0.62"/>
  <!-- near bank (south) -->
  <path d="M 0 560 Q 400 585 800 560 L 800 720 Q 400 760 0 720 Z" fill="url(#bank)"/>
  <!-- stones on the water's edge (small real thing) -->
  <ellipse cx="170" cy="566" rx="34" ry="22" fill="#5f5549"/>
  <ellipse cx="260" cy="574" rx="30" ry="18" fill="#58574e"/>
  <ellipse cx="520" cy="572" rx="38" ry="22" fill="#635b4f"/>
  <ellipse cx="620" cy="564" rx="30" ry="19" fill="#545249"/>
  <!-- bench on the near bank -->
  <rect x="430" y="640" width="150" height="26" rx="6" fill="#6b5637"/>
  <rect x="430" y="666" width="150" height="12" rx="4" fill="#57452e"/>
  <!-- hand-painted sign: a real word on the bank -->
  <g transform="translate(600,520)">
    <rect x="-150" y="-22" width="300" height="44" rx="6" fill="#e8d89b" stroke="#7a6a34" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#3a2d10" font-weight="bold">THE WATER READS</text>
  </g>
  <!-- warm sign lamp glow (plaque-craft: warm light) -->
  <circle cx="752" cy="520" r="90" fill="#ffcc77" opacity="0.30"/>
  <circle cx="752" cy="520" r="34" fill="#fff1c8" opacity="0.55"/>
  <!-- the dog — MASS first. low tawny capsule, head front-third -->
  <g transform="translate(230,660)">
    <!-- narrow shadow under the mass -->
    <ellipse cx="30" cy="52" rx="70" ry="11" fill="#2f2a20" opacity="0.35"/>
    <!-- body: low rounded capsule, two-tone -->
    <path d="M -52 30 Q -40 2 14 0 Q 64 2 92 26 Q 96 34 86 38 L -20 38 Q -56 36 -52 30 Z" fill="#b08a5a"/>
    <!-- darker back -->
    <path d="M -30 12 Q 10 4 58 6 Q 80 8 92 20 L 84 24 Q 40 12 -6 16 Z" fill="#8f6a3d" opacity="0.55"/>
    <!-- lighter chest/front -->
    <ellipse cx="-30" cy="24" rx="22" ry="14" fill="#d8b986" opacity="0.8"/>
    <!-- head = front THIRD of the mass, sitting low, touching the body -->
    <path d="M 48 8 Q 92 2 112 18 Q 122 30 108 40 Q 92 48 66 44 Q 46 40 48 26 Z" fill="#b08a5a"/>
    <!-- cream snout pointing DOWN to the bank rim -->
    <path d="M 96 30 Q 116 32 118 46 Q 118 52 108 50 Q 96 46 96 30 Z" fill="#e6c99a"/>
    <!-- black nose AT the tip of the snout -->
    <ellipse cx="112" cy="47" rx="7" ry="6" fill="#1c1814"/>
    <!-- one dark eye dot -->
    <circle cx="84" cy="22" r="3.2" fill="#1c1814"/>
    <!-- lopsided ears at DIFFERENT heights, both touching the head -->
    <path d="M 60 10 Q 56 -8 66 -10 Q 74 -12 74 2 Q 72 8 66 10 Z" fill="#7a5530"/>
    <path d="M 78 6 Q 74 -14 84 -16 Q 94 -18 96 -4 Q 94 2 86 6 Z" fill="#6f502c"/>
    <!-- four thin legs with feet -->
    <rect x="-30" y="36" width="7" height="22" rx="3" fill="#a9824f"/>
    <rect x="-12" y="38" width="7" height="22" rx="3" fill="#a9824f"/>
    <rect x="48" y="40" width="7" height="22" rx="3" fill="#9d7a45"/>
    <rect x="64" y="38" width="7" height="22" rx="3" fill="#9d7a45"/>
    <!-- red collar behind the head -->
    <rect x="52" y="20" width="10" height="5" rx="2" fill="#a0302a"/>
  </g>
  <!-- fog low across the near bank (the fact, not a wash) -->
  <path d="M 0 640 Q 400 620 800 640 L 800 700 Q 400 680 0 700 Z" fill="#dfe6e6" opacity="0.30"/>
  <!-- soft light: dawn band low on the right -->
  <rect x="540" y="300" width="260" height="500" fill="#ffe9c0" opacity="0.12"/>
</svg>