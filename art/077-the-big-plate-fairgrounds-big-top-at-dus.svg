<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="dusk" cx="0.5" cy="0.42" r="0.95">
      <stop offset="0" stop-color="#4b2e4a"/>
      <stop offset="0.45" stop-color="#33253f"/>
      <stop offset="0.8" stop-color="#1c1729"/>
      <stop offset="1" stop-color="#0d0a14"/>
    </radialGradient>
    <linearGradient id="topLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e0a8"/>
      <stop offset="0.55" stop-color="#e8c97b"/>
      <stop offset="1" stop-color="#b98a3e"/>
    </linearGradient>
    <linearGradient id="roofShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5604a"/>
      <stop offset="1" stop-color="#9e2a22"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff3c7" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#f0c86b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0c86b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#dusk)"/>
  <!-- moon -->
  <circle cx="640" cy="150" r="40" fill="#f5e9c3" opacity="0.9"/>
  <!-- distant hills -->
  <path d="M0 470 L150 440 L300 455 L520 435 L700 450 L800 440 L800 560 L0 560 Z" fill="#241a2e" opacity="0.75"/>
  <!-- ground -->
  <path d="M0 560 L800 560 L800 800 L0 800 Z" fill="#271820"/>
  <!-- ground light pool under top -->
  <ellipse cx="400" cy="690" rx="240" ry="70" fill="url(#pool)"/>
  <!-- fairground big top -->
  <g transform="translate(400,640)">
    <!-- drum body -->
    <path d="M-120 -60 L120 -60 L118 60 L-118 60 Z" fill="url(#topLight)"/>
    <!-- stripes on drum -->
    <path d="M-84 -60 L-72 60 L-40 60 L-52 -60 Z" fill="#b5433a" opacity="0.7"/>
    <path d="M-18 -60 L-6 60 L26 60 L14 -60 Z" fill="#b5433a" opacity="0.7"/>
    <path d="M44 -60 L56 60 L88 60 L76 -60 Z" fill="#b5433a" opacity="0.7"/>
    <!-- cone roof -->
    <path d="M-118 -60 L0 -235 L118 -60 Z" fill="url(#roofShade)"/>
    <!-- roof highlight left -->
    <path d="M0 -235 L-52 -80 L-46 -60 L0 -140 Z" fill="#ff9d7a" opacity="0.5"/>
    <!-- roof stripes -->
    <path d="M0 -235 L-30 -90 L-18 -72 L-2 -130 Z" fill="#fff1c4" opacity="0.8"/>
    <path d="M0 -235 L28 -92 L42 -72 L30 -128 Z" fill="#fff1c4" opacity="0.7"/>
    <!-- tip -->
    <circle cx="0" cy="-238" r="12" fill="#f6e7b0"/>
    <!-- tip star -->
    <path d="M0 -246 L6 -238 L-4 -238 Z" fill="#d94d3a"/>
    <!-- door -->
    <rect x="-34" y="-2" width="68" height="62" fill="#241410"/>
    <rect x="-40" y="-8" width="80" height="70" fill="#e8c97b" opacity="0.55"/>
    <!-- warm glow at door -->
    <ellipse cx="0" cy="56" rx="72" ry="30" fill="url(#pool)"/>
  </g>
  <!-- flag pole + flag right of top -->
  <line x1="560" y1="640" x2="560" y2="420" stroke="#9a8a70" stroke-width="8"/>
  <path d="M560 430 L640 452 L640 492 L560 470 Z" fill="#3f7fd1"/>
  <!-- entrance arch -->
  <g transform="translate(400,640)">
    <path d="M-150 30 Q-150 -40 -90 -40" fill="none" stroke="#f3e0a8" stroke-width="16" opacity="0.6"/>
    <path d="M150 30 Q150 -40 90 -40" fill="none" stroke="#f3e0a8" stroke-width="16" opacity="0.6"/>
  </g>
  <!-- lanterns -->
  <circle cx="265" cy="430" r="9" fill="#ffd98a"/>
  <circle cx="535" cy="430" r="9" fill="#ffd98a"/>
  <circle cx="265" cy="520" r="8" fill="#ffb95f"/>
  <circle cx="535" cy="520" r="8" fill="#ffb95f"/>
  <!-- bench foreground -->
  <rect x="180" y="735" width="120" height="18" fill="#7a5a38"/>
  <rect x="180" y="753" width="120" height="30" fill="#5a3f28"/>
  <rect x="600" y="735" width="120" height="18" fill="#7a5a38"/>
  <rect x="600" y="753" width="120" height="30" fill="#5a3f28"/>
  <!-- sign board -->
  <g transform="translate(130,560)">
    <rect x="-70" y="-30" width="140" height="70" fill="#e8c97b"/>
    <rect x="-78" y="-38" width="156" height="86" fill="#8a5a30"/>
    <text x="0" y="0" font-family="Georgia,serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#2a1408">BIG</text>
    <text x="0" y="24" font-family="Georgia,serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#2a1408">PLATE</text>
  </g>
</svg>