<text x="450" y="470" text-anchor="middle" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#2a1a05">MILLBILLILLIE</text>
<text x="450" y="498" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#2a1a05">meteorite — 1960, W.A.</text>
<rect x="330" y="560" width="240" height="70" fill="#e8dcc4"/>
<text x="450" y="595" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#2a1a05">eucrite achondrite</text>
<text x="450" y="620" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#2a1a05">a stony meteorite, with a hole in the sky</text>
<text x="450" y="642" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#2a1a05">in the stone.</text>
