<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4438"/>
      <stop offset="0.55" stop-color="#3a2822"/>
      <stop offset="1" stop-color="#171010"/>
    </linearGradient>
    <radialGradient id="lightpool" cx="0.5" cy="0.86" r="0.72">
      <stop offset="0" stop-color="#ffe3a8" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#e9a84e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e9a84e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6ee"/>
      <stop offset="0.55" stop-color="#e2dacf"/>
      <stop offset="1" stop-color="#aca38f"/>
    </linearGradient>
    <linearGradient id="dogbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a05a"/>
      <stop offset="1" stop-color="#c07e36"/>
    </linearGradient>
    <radialGradient id="plateglow" cx="0.45" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#fff6e0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6e0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="800" height="800" fill="url(#wall)"/>
  <rect x="0" y="0" width="800" height="800" fill="url(#lightpool)"/>
  <!-- warm dawn horizon band -->
  <ellipse cx="400" cy="395" rx="400" ry="16" fill="#f4c25e" opacity="0.42"/>
  <!-- table edge under the plate (so the plate sits, not floats) -->
  <path d="M0,760 L800,760 L800,800 L0,800 Z" fill="#2a1b13"/>
  <rect x="0" y="752" width="800" height="10" fill="#5a3a24" opacity="0.9"/>
  <!-- THE BIG PALE PLATE -->
  <ellipse cx="400" cy="600" rx="310" ry="175" fill="url(#plate)"/>
  <ellipse cx="400" cy="588" rx="240" ry="132" fill="#e8e2d3"/>
  <ellipse cx="400" cy="572" rx="210" ry="108" fill="url(#plateglow)"/>
  <!-- pie at the bottom of the plate -->
  <ellipse cx="400" cy="668" rx="58" ry="18" fill="#9a5829"/>
  <ellipse cx="400" cy="658" rx="50" ry="15" fill="#bd7533"/>
  <ellipse cx="400" cy="655" rx="28" ry="8" fill="#f0c47a"/>
  <!-- THE DOG: low tawny capsule, head front-third -->
  <g transform="translate(318,512)">
    <!-- narrow dawn shadow under the dog -->
    <ellipse cx="24" cy="92" rx="175" ry="16" fill="#3a2a22" opacity="0.5"/>
    <!-- body mass: low wide tawny capsule -->
    <path d="M-152,8 C-152,-42 -62,-68 32,-64 C100,-60 124,-32 122,0 C120,28 72,46 22,44 C-28,42 -92,30 -124,14 C-142,4 -152,-2 -152,8 Z" fill="url(#dogbody)"/>
    <!-- lighter chest/front -->
    <path d="M-48,-6 C-18,-32 38,-36 78,-16 C88,2 78,26 56,28 C24,30 -20,18 -32,-4 C-38,-12 -44,-12 -48,-6 Z" fill="#ecc98a" opacity="0.92"/>
    <!-- head = front third, sits lower, reads from the side -->
    <path d="M42,-32 C84,-32 114,-10 112,12 C110,32 88,44 64,40 C40,36 32,12 36,-8 C40,-26 42,-32 42,-32 Z" fill="url(#dogbody)"/>
    <!-- cream wedge snout pointing DOWN to the plate rim -->
    <path d="M80,24 C98,12 110,2 110,-8 C110,-16 101,-20 93,-15 C85,-8 82,4 80,16 C79,20 80,22 80,24 Z" fill="#f2e4c6"/>
    <circle cx="108" cy="-12" r="5.5" fill="#221810"/>
    <!-- ONE eye, dark -->
    <circle cx="56" cy="-4" r="4.2" fill="#221810"/>
    <!-- two lopsided ears at DIFFERENT heights, both touch the head -->
    <path d="M46,-34 C44,-56 32,-60 28,-50 C26,-42 32,-34 40,-34 Z" fill="#8a5a2e"/>
    <path d="M60,-32 C66,-68 82,-70 84,-52 C84,-38 72,-32 64,-32 Z" fill="#9a6a34"/>
    <!-- red collar behind the head -->
    <rect x="14" y="30" width="13" height="13" fill="#c0392b" rx="3"/>
    <!-- four thin legs with feet -->
    <g stroke="#b98342" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M-138,32 L-134,66"/>
      <path d="M-84,42 L-82,70"/>
      <path d="M20,44 L22,72"/>
      <path d="M68,38 L72,66"/>
    </g>
  </g>
  <!-- low sun, warm edge, right -->
  <circle cx="610" cy="190" r="28" fill="#ffd9a0"/>
  <circle cx="610" cy="190" r="46" fill="#ffd9a0" opacity="0.25"/>
</svg>