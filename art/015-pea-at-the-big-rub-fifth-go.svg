<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#ff4400" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="30%" stop-color="#ff8800"/>
      <stop offset="70%" stop-color="#ff4400"/>
      <stop offset="100%" stop-color="#881100"/>
    </radialGradient>
    <linearGradient id="grateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="50%" stop-color="#444"/>
      <stop offset="100%" stop-color="#222"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0e8dc"/>
      <stop offset="100%" stop-color="#d0c8b8"/>
    </linearGradient>
  </defs>

  <!-- Dark kitchen wall -->
  <rect width="800" height="800" fill="#1a1210"/>
  
  <!-- Warm glow from below -->
  <rect width="800" height="800" fill="url(#glow)"/>
  
  <!-- ===== THE BIG RUB sign — hand-painted, chalky, on a board ===== -->
  <rect x="270" y="140" width="260" height="65" rx="12" fill="#2a0a0a" stroke="#8a2a0a" stroke-width="6"/>
  <!-- Chalky texture lines on the sign background -->
  <line x1="290" y1="155" x2="510" y2="155" stroke="#3a1a1a" stroke-width="2" opacity="0.5"/>
  <text x="400" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#ffdd00" letter-spacing="2">THE BIG RUB</text>

  <!-- ===== The grill table — solid, wooden, with a visible top surface ===== -->
  <!-- Table body -->
  <rect x="130" y="540" width="540" height="260" rx="6" fill="#3a2a1a" stroke="#2a1a0a" stroke-width="5"/>
  <!-- Table top surface (horizontal plane you can see) -->
  <rect x="130" y="540" width="540" height="20" fill="#4a3520" stroke="#2a1a0a" stroke-width="3"/>
  <!-- Wood grain lines on table front -->
  <line x1="180" y1="565" x2="180" y2="780" stroke="#2a1a0a" stroke-width="1.5" opacity="0.4"/>
  <line x1="300" y1="565" x2="300" y2="780" stroke="#2a1a0a" stroke-width="1.5" opacity="0.4"/>
  <line x1="450" y1="565" x2="450" y2="780" stroke="#2a1a0a" stroke-width="1.5" opacity="0.4"/>
  <line x1="570" y1="565" x2="570" y2="780" stroke="#2a1a0a" stroke-width="1.5" opacity="0.4"/>

  <!-- ===== COAL BED — glowing coals visible under the grate bars ===== -->
  <!-- Coal bed glow -->
  <ellipse cx="400" cy="740" rx="250" ry="30" fill="url(#coalGlow)" opacity="0.6"/>
  <!-- Individual glowing coals -->
  <ellipse cx="250" cy="738" rx="20" ry="12" fill="#ff8800" opacity="0.8"/>
  <ellipse cx="320" cy="745" rx="22" ry="12" fill="#ffaa00" opacity="0.9"/>
  <ellipse cx="400" cy="740" rx="25" ry="13" fill="#ffcc00" opacity="0.9"/>
  <ellipse cx="480" cy="745" rx="22" ry="12" fill="#ff8800" opacity="0.8"/>
  <ellipse cx="540" cy="738" rx="20" ry="12" fill="#ff6600" opacity="0.8"/>
  <!-- Embers spitting up -->
  <circle cx="380" cy="710" r="4" fill="#ffcc00" opacity="0.7"/>
  <circle cx="420" cy="700" r="3" fill="#ff8800" opacity="0.6"/>
  <circle cx="450" cy="720" r="4" fill="#ffcc00" opacity="0.5"/>

  <!-- ===== GRATE BARS — 5 horizontal bars, proper iron, with gaps showing coals ===== -->
  <!-- The bars have gaps between them so you can see the coals -->
  <g stroke="url(#grateGrad)" stroke-width="16" stroke-linecap="round">
    <line x1="165" y1="565" x2="635" y2="565"/>
    <line x1="165" y1="595" x2="635" y2="595"/>
    <line x1="165" y1="625" x2="635" y2="625"/>
    <line x1="165" y1="655" x2="635" y2="655"/>
    <line x1="165" y1="685" x2="635" y2="685"/>
  </g>
  <!-- Bar ends (you can see them poking out) -->
  <circle cx="165" cy="565" r="8" fill="#333"/>
  <circle cx="635" cy="565" r="8" fill="#333"/>
  <circle cx="165" cy="685" r="8" fill="#333"/>
  <circle cx="635" cy="685" r="8" fill="#333"/>

  <!-- ===== SAUSAGES ON THE GRATE — three rows, sitting ON the bars, overlapping properly ===== -->
  <!-- Bottom row: 3 sausages on bar 1 (y=565), sitting on top of it -->
  <ellipse cx="350" cy="555" rx="130" ry="20" fill="#a3542f" stroke="#6a351f" stroke-width="4"/>
  <ellipse cx="480" cy="555" rx="130" ry="20" fill="#a3542f" stroke="#6a351f" stroke-width="4"/>
  <ellipse cx="600" cy="555" rx="120" ry="20" fill="#a3542f" stroke="#6a351f" stroke-width="4"/>
  <!-- Middle row: 2 sausages on bar 2 (y=595), offset -->
  <ellipse cx="420" cy="585" rx="140" ry="20" fill="#b3653a" stroke="#7a4a2a" stroke-width="4"/>
  <ellipse cx="560" cy="585" rx="130" ry="20" fill="#b3653a" stroke="#7a4a2a" stroke-width="4"/>
  <!-- Top row: 2 sausages on bar 3 (y=625), offset -->
  <ellipse cx="460" cy="615" rx="130" ry="20" fill="#c3754a" stroke="#8a5535" stroke-width="4"/>
  <ellipse cx="580" cy="615" rx="120" ry="20" fill="#c3754a" stroke="#8a5535" stroke-width="4"/>
  <!-- Top of top row: 1 sausage -->
  <ellipse cx="520" cy="595" rx="100" ry="18" fill="#c3754a" stroke="#8a5535" stroke-width="4"/>

  <!-- ===== PEA — standing on the LEFT side of the table, facing RIGHT toward the sausages ===== -->
  <!-- His body is on the left, head turned to the right -->
  <!-- Tail (wagging, thin, curving) -->
  <path d="M 190 460 Q 175 480 185 500 Q 175 510 180 520" fill="none" stroke="#d4a060" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Body (horizontal, dog-shaped, facing right) -->
  <path d="M 200 480 Q 200 430 280 420 Q 380 415 420 440 Q 430 470 400 490 Q 380 510 300 510 Q 230 510 200 480 Z" 
        fill="#f0d8a0" stroke="#8a6a30" stroke-width="5"/>
  
  <!-- Head (facing right, at x~400, y~440) -->
  <path d="M 380 420 Q 400 400 430 405 Q 450 415 445 445 Q 440 470 415 475 Q 390 475 380 455 Z" 
        fill="#f0d8a0" stroke="#8a6a30" stroke-width="5"/>
  <!-- Snout (pointing right) -->
  <path d="M 430 445 Q 450 440 465 448 Q 468 460 455 468 Q 440 472 430 465 Z" 
        fill="#f5e0b0" stroke="#8a6a30" stroke-width="4"/>
  <!-- Nose (black, at the tip) -->
  <ellipse cx="460" cy="452" rx="8" ry="7" fill="#1a1a1a"/>
  <!-- Mouth (simple line) -->
  <path d="M 458 462 Q 452 468 445 468" fill="none" stroke="#5a3a1f" stroke-width="2.5"/>
  <!-- Eye (half-closed, happy, looking at the sausages) -->
  <path d="M 405 435 Q 415 430 425 435" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- Ear (floppy, hanging down on top of head, facing right) -->
  <path d="M 410 405 Q 430 380 455 395 Q 450 420 430 415 Z" 
        fill="#d4a060" stroke="#8a6a30" stroke-width="4"/>
  
  <!-- FRONT PAWS (toed, standing on the table top at y=560) -->
  <!-- Paw 1 (front left, x~380) -->
  <rect x="370" y="520" width="22" height="40" rx="8" fill="#f0d8a0" stroke="#8a6a30" stroke-width="4"/>
  <line x1="374" y1="560" x2="374" y2="575" stroke="#8a6a30" stroke-width="2.5"/>
  <line x1="380" y1="560" x2="380" y2="575" stroke="#8a6a30" stroke-width="2.5"/>
  <line x1="386" y1="560" x2="386" y2="575" stroke="#8a6a30" stroke-width="2.5"/>
  <!-- Paw 2 (front right, x~410) -->
  <rect x="405" y="520" width="22" height="40" rx="8" fill="#f0d8a0" stroke="#8a6a30" stroke-width="4"/>
  <line x1="409" y1="560" x2="409" y2="575" stroke="#8a6a30" stroke-width="2.5"/>
  <line x1="415" y1="560" x2="415" y2="575" stroke="#8a6a30" stroke-width="2.5"/>
  <line x1="421" y1="560" x2="421" y2="575" stroke="#8a6a30" stroke-width="2.5"/>
  
  <!-- BACK PAWS (on the table, x~230 and x~270) -->
  <rect x="220" y="500" width="22" height="60" rx="8" fill="#f0d8a0" stroke="#8a6a30" stroke-width="4"/>
  <line x1="224" y1="560" x2="224" y2="575" stroke="#8a6a30" stroke-width="2.5"/>
  <line x1="230" y1="560" x2="230" y2="575" stroke="#8a6a30" stroke-width="2.5"/>
  <line x1="236" y1="560" x2="236" y2="575" stroke="#8a6a30" stroke-width="2.5"/>
  <rect x="260" y="495" width="22" height="65" rx="8" fill="#f0d8a0" stroke="#8a6a30" stroke-width="4"/>
  <line x1="264" y1="560" x2="264" y2="575" stroke="#8a6a30" stroke-width="2.5"/>
  <line x1="270" y1="560" x2="270" y2="575" stroke="#8a6a30" stroke-width="2.5"/>
  <line x1="276" y1="560" x2="276" y2="575" stroke="#8a6a30" stroke-width="2.5"/>

  <!-- ===== BIG PLATE in the foreground, bottom center — a PROPER HEAP ===== -->
  <!-- Plate: large, white, with a visible rim -->
  <ellipse cx="400" cy="770" rx="150" ry="35" fill="#c0b8a8" stroke="#8a8070" stroke-width="5"/>
  <ellipse cx="400" cy="758" rx="138" ry="32" fill="url(#plateGrad)" stroke="#d0c8b8" stroke-width="3"/>
  <ellipse cx="400" cy="748" rx="125" ry="30" fill="#faf5ec" stroke="#e8e0d0" stroke-width="2"/>
  <ellipse cx="400" cy="740" rx="110" ry="26" fill="#f5eee0" stroke="#e0d8c8" stroke-width="2"/>
  
  <!-- HEAP: 5 sausages stacked high, proper portion -->
  <ellipse cx="400" cy="720" rx="95" ry="20" fill="#a3542f" stroke="#6a351f" stroke-width="4"/>
  <ellipse cx="400" cy="700" rx="90" ry="20" fill="#b3653a" stroke="#7a4a2a" stroke-width="4"/>
  <ellipse cx="400" cy="680" rx="85" ry="20" fill="#c3754a" stroke="#8a5535" stroke-width="4"/>
  <ellipse cx="400" cy="660" rx="80" ry="20" fill="#a3542f" stroke="#6a351f" stroke-width="4"/>
  <ellipse cx="400" cy="640" rx="75" ry="18" fill="#b3653a" stroke="#7a4a2a" stroke-width="4"/>
</svg>