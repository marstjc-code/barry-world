  <path d="M512 486 Q582 478 594 520 Q602 558 556 566 Q486 572 478 534 Q472 506 512 486 Z" fill="#f3e6b0"/>
  <path d="M594 508 L626 484 L620 512 Z" fill="#f3e6b0"/>
