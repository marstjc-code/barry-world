  <ellipse cx="390" cy="522" rx="62" ry="26" fill="#c26a2a"/>
  <ellipse cx="390" cy="516" rx="54" ry="20" fill="#d97d38"/>
  <ellipse cx="390" cy="510" rx="44" ry="14" fill="#e08a46"/>
