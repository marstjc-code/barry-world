  <rect x="700" y="38" width="74" height="96" fill="#f2ece0" stroke="#c9c1b0" stroke-width="3"/>
  <rect x="712" y="50" width="50" height="72" fill="#6d7a4f" stroke="#4d5838" stroke-width="2"/>
  <text x="737" y="84" font-size="13" fill="#4d5838" text-anchor="middle">VILLAGE</text>
  <text x="737" y="104" font-size="12" fill="#4d5838" text-anchor="middle">POSTCARD</text>
  <circle cx="724" cy="150" r="18" fill="none" stroke="#b3a58a" stroke-width="2"/>
  <text x="724" y="156" font-size="12" fill="#b3a58a" text-anchor="middle">BAR</text>
  <!-- caption -->
  <text x="400" y="574" font-family="serif" font-size="20" fill="#2a2418" text-anchor="middle" font-weight="bold">take the village home</text>
