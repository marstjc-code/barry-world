    <rect x="232" y="98" width="3" height="3"/>
    <rect x="344" y="58" width="3" height="3"/>
    <rect x="488" y="100" width="3" height="3"/>
    <rect x="562" y="60" width="3" height="3"/>
    <circle cx="172" cy="120" r="2"/>
    <circle cx="414" cy="132" r="2"/>
