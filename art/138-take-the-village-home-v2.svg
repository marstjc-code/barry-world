<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10131c"/>
      <stop offset="0.55" stop-color="#22283a"/>
      <stop offset="1" stop-color="#2e3542"/>
    </linearGradient>
    <radialGradient id="moonhalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- cream card -->
  <rect width="800" height="600" fill="#f5eedd"/>
  <rect x="18" y="18" width="764" height="564" fill="url(#sky)"/>
  <!-- moon with halo -->
  <circle cx="648" cy="118" r="70" fill="url(#moonhalo)"/>
  <circle cx="648" cy="118" r="32" fill="#efe9d6"/>
  <circle cx="636" cy="106" r="9" fill="#d8d2bd"/>
  <!-- stars -->
  <g fill="#f5ecd3">
