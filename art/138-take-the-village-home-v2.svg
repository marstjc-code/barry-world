  <rect x="196" y="344" width="80" height="66" fill="#11141a"/>
  <rect x="224" y="350" width="16" height="16" fill="#ffe9a0"/>
  <rect x="308" y="348" width="72" height="62" fill="#0f1116"/>
  <rect x="334" y="354" width="15" height="15" fill="#f6c34e"/>
  <rect x="412" y="340" width="82" height="70" fill="#111419"/>
  <rect x="440" y="346" width="16" height="16" fill="#ffd86e"/>
  <rect x="522" y="346" width="72" height="64" fill="#101318"/>
  <rect x="548" y="352" width="15" height="15" fill="#ffe9a0"/>
