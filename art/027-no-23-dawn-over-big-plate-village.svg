<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b3a"/>
      <stop offset="0.35" stop-color="#2a4a7a"/>
      <stop offset="0.6" stop-color="#7a8fb8"/>
      <stop offset="0.78" stop-color="#e8a45c"/>
      <stop offset="0.88" stop-color="#f2c56a"/>
      <stop offset="1" stop-color="#f6e0a0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.72" cy="0.72" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffd98a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d8" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffdd8a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffdd8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#233320"/>
      <stop offset="0.5" stop-color="#33462a"/>
      <stop offset="1" stop-color="#465a33"/>
    </linearGradient>
    <linearGradient id="warmWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#f2c56a"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="900" height="900" fill="url(#sky)"/>

  <!-- sun low on the east, just above horizon -->
  <circle cx="650" cy="510" r="62" fill="#fff3c4"/>
  <circle cx="650" cy="510" r="96" fill="url(#sunGlow)"/>

  <!-- far hills -->
  <path d="M0,470 Q180,430 360,452 T720,440 Q820,438 900,452 L900,560 L0,560 Z" fill="#5a6e4f" opacity="0.75"/>
  <path d="M0,500 Q220,460 420,488 T760,480 Q840,478 900,492 L900,600 L0,600 Z" fill="#485a3f" opacity="0.85"/>

  <!-- ground -->
  <rect x="0" y="545" width="900" height="355" fill="url(#ground)"/>

  <!-- dawn light pooling across the ground (warm wash from east) -->
  <ellipse cx="620" cy="640" rx="320" ry="90" fill="url(#sunGlow)" opacity="0.35"/>
  <ellipse cx="520" cy="700" rx="380" ry="80" fill="#f2c56a" opacity="0.16"/>

  <!-- Main Street spine, receding from bottom-centre toward the kitchen -->
  <path d="M430,900 L430,560 L560,900 Z" fill="#d9c99a" opacity="0.9"/>
  <path d="M470,900 L470,600 L520,900 Z" fill="#e8d9ae" opacity="0.5"/>

  <!-- kitchen (centre) — warm windows in dawn -->
  <g transform="translate(430,470)">
    <rect x="-60" y="-70" width="140" height="90" fill="#a9713f"/>
    <rect x="-50" y="-55" width="120" height="70" fill="#c08a4f"/>
    <rect x="-42" y="-45" width="22" height="32" fill="url(#warmWin)"/>
    <rect x="-12" y="-45" width="22" height="32" fill="url(#warmWin)"/>
    <rect x="18" y="-45" width="22" height="32" fill="url(#warmWin)"/>
    <rect x="48" y="-45" width="22" height="32" fill="url(#warmWin)"/>
    <rect x="-60" y="-82" width="140" height="14" fill="#7a4a24"/>
    <rect x="-35" y="-92" width="70" height="12" fill="#f0e6d0"/>
    <text x="0" y="-80" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#4a2a14" text-anchor="middle" transform="scale(1.6) translate(0,0)">KITCHEN</text>
  </g>

  <!-- gallery (west) -->
  <g transform="translate(200,520)">
    <rect x="-55" y="-40" width="110" height="52" fill="#3a3a3a"/>
    <rect x="-45" y="-30" width="90" height="34" fill="#2b2b2b"/>
    <rect x="-38" y="-24" width="24" height="22" fill="#d9d2c0"/>
    <rect x="-2" y="-24" width="24" height="22" fill="#d9d2c0"/>
    <rect x="32" y="-24" width="24" height="22" fill="#d9d2c0"/>
  </g>

  <!-- shop-window (east, lower) -->
  <g transform="translate(640,660)">
    <rect x="-45" y="-40" width="90" height="46" fill="#d8c7a8"/>
    <rect x="-38" y="-34" width="76" height="30" fill="#f2e8cf"/>
    <rect x="-38" y="-40" width="90" height="10" fill="#a92f2f"/>
  </g>

  <!-- dance floor (east, upper) checkerboard + corner lamps -->
  <g transform="translate(700,560)">
    <rect x="-55" y="-45" width="110" height="60" fill="#2e2e2e"/>
    <rect x="-42" y="-34" width="22" height="22" fill="#e8e8e8"/>
    <rect x="-18" y="-34" width="22" height="22" fill="#2e2e2e"/>
    <rect x="6" y="-34" width="22" height="22" fill="#e8e8e8"/>
    <rect x="-42" y="-12" width="22" height="22" fill="#2e2e2e"/>
    <rect x="-18" y="-12" width="22" height="22" fill="#e8e8e8"/>
    <rect x="6" y="-12" width="22" height="22" fill="#2e2e2e"/>
  </g>

  <!-- street lamps: glowing, still on at dawn -->
  <g>
    <!-- lamp 1 -->
    <line x1="330" y1="640" x2="330" y2="600" stroke="#2b2b2b" stroke-width="6"/>
    <circle cx="330" cy="592" r="20" fill="url(#lampGlow)"/>
    <circle cx="330" cy="598" r="6" fill="#fff7d8"/>
    <!-- lamp 2 -->
    <line x1="520" y1="640" x2="520" y2="600" stroke="#2b2b2b" stroke-width="6"/>
    <circle cx="520" cy="592" r="20" fill="url(#lampGlow)"/>
    <circle cx="520" cy="598" r="6" fill="#fff7d8"/>
    <!-- lamp 3 -->
    <line x1="640" y1="620" x2="640" y2="585" stroke="#2b2b2b" stroke-width="6"/>
    <circle cx="640" cy="578" r="18" fill="url(#lampGlow)"/>
    <circle cx="640" cy="583" r="5" fill="#fff7d8"/>
  </g>

  <!-- corner lamps of dance floor (coloured, glowing) -->
  <circle cx="655" cy="520" r="14" fill="#ffb14a" opacity="0.85"/>
  <circle cx="745" cy="520" r="14" fill="#4a90d0" opacity="0.85"/>
  <circle cx="655" cy="600" r="14" fill="#d05aa0" opacity="0.75"/>
  <circle cx="745" cy="600" r="14" fill="#5aa05a" opacity="0.75"/>

  <!-- hand-painted sign -->
  <g transform="translate(150,640)">
    <rect x="-95" y="-22" width="190" height="44" rx="6" fill="#7a2e2e"/>
    <rect x="-85" y="-14" width="170" height="28" rx="3" fill="#9a4040"/>
    <text x="0" y="1" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#ffe9c8" text-anchor="middle" letter-spacing="1">BAKED, NOT DISPLAYED</text>
    <rect x="-95" y="-24" width="190" height="48" rx="8" fill="none" stroke="#fff3c4" stroke-width="2"/>
  </g>

  <!-- foreground: Pea, real dog, on the path -->
  <g transform="translate(450,800) scale(1.7)">
    <ellipse cx="0" cy="20" rx="40" ry="14" fill="#7a6a5a" opacity="0.35"/>
    <path d="M-45,12 Q-45,-12 -18,-16 L0,-18 Q20,-20 30,-8 L38,2 Q44,10 40,18 L30,26 Q10,30 -12,28 L-30,26 Q-42,24 -45,12 Z" fill="#8a7a62"/>
    <path d="M-45,12 Q-58,-4 -50,-16 Q-46,-26 -40,-22 L-34,-14 Z" fill="#6a5a42"/>
    <path d="M-38,-16 Q-44,-22 -36,-24 Q-32,-22 -34,-16 Z" fill="#6a5a42"/>
    <path d="M26,-10 Q36,-12 40,-4 Q44,2 42,8 Q38,12 34,8 Q34,0 30,-6 Z" fill="#6a5a42"/>
    <path d="M36,4 Q34,10 28,12 Q30,8 34,6 Z" fill="#6a5a42"/>
    <ellipse cx="-30" cy="-6" rx="4" ry="3" fill="#2b2b2b"/>
    <line x1="-36" y1="-6" x2="-24" y2="-6" stroke="#2b2b2b" stroke-width="3"/>
    <path d="M34,-6 Q28,-8 22,-6 Q24,-4 28,-4 Q30,-4 34,-6 Z" fill="#f2e8cf"/>
    <path d="M22,-6 Q20,-12 28,-14 Q32,-12 30,-8 Q26,-8 22,-6 Z" fill="#5a4a38"/>
  </g>

  <!-- Pea's tail curled -->
  <path d="M-30,26 Q-44,24 -48,30 Q-50,36 -44,38 Q-38,36 -36,30" fill="none" stroke="#6a5a42" stroke-width="6" stroke-linecap="round"/>

  <!-- BIG plate in foreground, with a pie -->
  <g transform="translate(450,872) scale(1.5)">
    <ellipse cx="0" cy="0" rx="42" ry="12" fill="#f2e8cf"/>
    <ellipse cx="0" cy="2" rx="40" ry="10" fill="#e6d8be"/>
    <ellipse cx="0" cy="2" rx="34" ry="8" fill="#f8eecd"/>
    <ellipse cx="0" cy="1" rx="18" ry="5.5" fill="#a95828"/>
    <ellipse cx="0" cy="0.5" rx="14" ry="4" fill="#b86a38"/>
    <ellipse cx="0" cy="-0.5" rx="12" ry="3" fill="#c87a48"/>
  </g>

  <!-- timestamp + signature -->
  <text x="900" y="64" font-family="Georgia,serif" font-size="15" fill="#fff3c4" text-anchor="end" opacity="0.9">Sunrise 07:31</text>
  <text x="26" y="868" font-family="Georgia,serif" font-size="14" fill="#fff3c4" opacity="0.8">BARRY — DAWN OVER BIG PLATE VILLAGE</text>
</svg>