<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a3e"/>
      <stop offset="0.35" stop-color="#3b4a6b"/>
      <stop offset="0.7" stop-color="#c97a4b"/>
      <stop offset="1" stop-color="#f3b77a"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d6c2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f3e3d0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#e9d6c2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#ff9d2e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5a3c"/>
      <stop offset="1" stop-color="#4a3d26"/>
    </linearGradient>
  </defs>
  <!-- sky -->
  <rect width="800" height="800" fill="url(#sky)"/>
  <!-- faint sun low on horizon -->
  <circle cx="400" cy="300" r="26" fill="#ffe3b0" opacity="0.85"/>
  <circle cx="400" cy="300" r="48" fill="#ffcb8e" opacity="0.35"/>
  <!-- distant building silhouettes, fading -->
  <g fill="#2b2f44" opacity="0.9">
    <rect x="80" y="270" width="120" height="60"/>
    <rect x="240" y="258" width="150" height="72"/>
    <rect x="420" y="262" width="140" height="68"/>
    <rect x="560" y="272" width="150" height="58"/>
  </g>
  <g fill="#3a445e" opacity="0.7">
    <rect x="150" y="290" width="90" height="40"/>
    <rect x="500" y="292" width="80" height="42"/>
  </g>
  <!-- fog band across the horizon, with breaks -->
  <rect x="0" y="280" width="800" height="90" fill="url(#fog)"/>
  <path d="M0 290 Q120 300 240 292 T480 294 T800 290 L800 300 L0 300 Z" fill="#f6e7d6" opacity="0.5"/>
  <path d="M0 305 Q200 295 400 303 T800 297 L800 320 L0 320 Z" fill="#efe0cf" opacity="0.45"/>
  <!-- cobblestone street receding to vanishing point at (400,300) -->
  <g stroke="#2a2418" stroke-width="1.5" stroke-opacity="0.7" fill="#5c5138">
    <polygon points="235,800 565,800 470,560 330,560"/>
  </g>
  <g fill="#6b5f3f" opacity="0.9">
    <polygon points="255,760 545,760 460,560 340,560"/>
  </g>
  <!-- cobble rows (wider near, narrower far) -->
  <g fill="#77683e" stroke="#3a3020" stroke-opacity="0.6">
    <polygon points="240,800 400,800 398,775 245,782"/>
    <polygon points="400,800 560,800 402,775 400,775"/>
    <polygon points="252,775 398,775 396,750 258,758"/>
    <polygon points="398,775 402,775 398,750 397,750"/>
    <polygon points="402,775 548,775 404,752 402,752"/>
  </g>
  <g fill="#77683e" stroke="#3a3020" stroke-opacity="0.6">
    <polygon points="262,750 396,750 392,722 270,730"/>
    <polygon points="396,750 398,750 392,722 392,722"/>
    <polygon points="404,752 538,752 398,724 404,726"/>
  </g>
  <!-- corner stones catching warm light on the right side (street-lamp side) -->
  <g fill="#c99a5a" opacity="0.55">
    <polygon points="400,800 560,800 470,560 420,580"/>
    <polygon points="235,800 390,800 395,770 245,780"/>
  </g>
  <!-- street lamps down the left side, receding -->
  <g id="lamps">
    <!-- near lamp -->
    <g>
      <rect x="212" y="520" width="10" height="230" fill="#3a3a3a"/>
      <rect x="212" y="470" width="10" height="50" fill="#333"/>
      <path d="M196 470 Q217 452 238 470" stroke="#333" stroke-width="5" fill="none"/>
      <circle cx="196" cy="468" r="9" fill="#2a2a2a"/>
      <circle cx="196" cy="468" r="7" fill="#ffd9a8"/>
      <circle cx="238" cy="468" r="9" fill="#2a2a2a"/>
      <circle cx="238" cy="468" r="7" fill="#ffd9a8"/>
      <circle cx="217" cy="468" r="42" fill="url(#lampGlow)"/>
      <ellipse cx="217" cy="720" rx="55" ry="14" fill="#ffb46e" opacity="0.3"/>
    </g>
    <!-- mid lamp -->
    <g transform="translate(250,0) scale(0.7) translate(-212, -430)">
      <rect x="212" y="520" width="10" height="230" fill="#3a3a3a"/>
      <path d="M196 470 Q217 452 238 470" stroke="#333" stroke-width="5" fill="none"/>
      <circle cx="196" cy="468" r="7" fill="#ffd9a8"/>
      <circle cx="238" cy="468" r="7" fill="#ffd9a8"/>
      <circle cx="217" cy="468" r="34" fill="url(#lampGlow)"/>
    </g>
    <!-- far lamp -->
    <g transform="translate(275,0) scale(0.5) translate(-212,-430)">
      <rect x="212" y="520" width="10" height="230" fill="#3a3a3a"/>
      <path d="M196 470 Q217 452 238 470" stroke="#333" stroke-width="5" fill="none"/>
      <circle cx="196" cy="468" r="6" fill="#ffd9a8"/>
      <circle cx="238" cy="468" r="6" fill="#ffd9a8"/>
    </g>
  </g>
  <!-- the big sign with a real word, standing on the right -->
  <g>
    <rect x="488" y="430" width="9" height="200" fill="#3a2e1e"/>
    <rect x="480" y="430" width="8" height="200" fill="#3a2e1e"/>
    <rect x="430" y="380" width="190" height="52" rx="8" fill="#7a2f1f" stroke="#3a150e" stroke-width="3"/>
    <rect x="438" y="388" width="174" height="36" rx="4" fill="#f3e3d0"/>
    <text x="525" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#7a2f1f">BIG PLATE VILLAGE</text>
    <text x="525" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#7a2f1f">COME HUNGRY</text>
  </g>
  <!-- big plate of pie in the foreground, left-bottom, steam -->
  <g transform="translate(150,650)">
    <ellipse cx="0" cy="40" rx="150" ry="28" fill="#2a2216" opacity="0.5"/>
    <ellipse cx="0" cy="34" rx="150" ry="30" fill="#f1ede6" stroke="#c9bfa8" stroke-width="3"/>
    <ellipse cx="0" cy="30" rx="122" ry="24" fill="#e8d9b0"/>
    <ellipse cx="0" cy="28" rx="95" ry="20" fill="#d9b06b"/>
    <ellipse cx="0" cy="26" rx="88" ry="17" fill="#c99a5a"/>
    <path d="M-60 14 Q-40 4 -20 12 T20 10 T60 14" stroke="#8a6a3a" stroke-width="2" fill="none" opacity="0.8"/>
    <circle cx="-40" cy="26" r="2" fill="#8a6a3a"/>
    <circle cx="0" cy="20" r="2" fill="#8a6a3a"/>
    <circle cx="40" cy="26" r="2" fill="#8a6a3a"/>
    <!-- steam -->
    <g stroke="#ffffff" stroke-width="4" fill="none" stroke-opacity="0.5" stroke-linecap="round">
      <path d="M-20 0 Q-30 -30 -15 -55 Q0 -75 -8 -95"/>
      <path d="M15 -5 Q25 -35 12 -60 Q2 -80 10 -100"/>
      <path d="M-2 -4 Q-8 -28 -2 -50"/>
    </g>
  </g>
  <!-- signature-ish hand word bottom right -->
  <text x="740" y="770" font-family="Georgia, serif" font-size="20" fill="#f3e3d0" transform="rotate(-4 740 770)">Barry's — 12 Nov 2026</text>
</svg>