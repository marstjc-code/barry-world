<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- dark place, warm light pooling -->
  <defs>
    <radialGradient id="glow" cx="55%" cy="62%" r="60%">
      <stop offset="0%" stop-color="#7a6a4a"/>
      <stop offset="45%" stop-color="#3a3530"/>
      <stop offset="100%" stop-color="#14120f"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5a7a"/>
      <stop offset="45%" stop-color="#2a4660"/>
      <stop offset="100%" stop-color="#1a2a38"/>
    </linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b06a"/>
      <stop offset="55%" stop-color="#3a5a7a"/>
      <stop offset="100%" stop-color="#14120f"/>
    </linearGradient>
  </defs>
  <!-- the dark room / shore -->
  <rect x="0" y="0" width="800" height="800" fill="#14120f"/>
  <!-- warm light pooling on the ground -->
  <rect x="0" y="0" width="800" height="800" fill="url(#glow)"/>
  <!-- dawn band at horizon -->
  <rect x="0" y="0" width="800" height="92" fill="url(#dawn)"/>
  <rect x="0" y="80" width="800" height="34" fill="#e8b06a" opacity="0.9"/>
  <!-- low sun on the right -->
  <circle cx="560" cy="58" r="26" fill="#f6c667"/>
  <circle cx="560" cy="58" r="44" fill="#f6c667" opacity="0.35"/>
  <!-- water -->
  <rect x="120" y="150" width="560" height="470" rx="10" fill="url(#water)"/>
  <!-- water reflections: thin warm streaks -->
  <rect x="430" y="170" width="34" height="200" fill="#e8b06a" opacity="0.4"/>
  <rect x="486" y="170" width="14" height="150" fill="#f6c667" opacity="0.5"/>
  <rect x="540" y="170" width="22" height="120" fill="#e8b06a" opacity="0.3"/>
  <!-- rocks framing the water -->
  <rect x="120" y="240" width="120" height="140" rx="18" fill="#c9a876"/>
  <rect x="120" y="430" width="120" height="130" rx="18" fill="#c19a6b"/>
  <rect x="540" y="240" width="120" height="140" rx="18" fill="#c9a876"/>
  <rect x="540" y="430" width="120" height="130" rx="18" fill="#c19a6b"/>
  <!-- sign post + real word, hand-painted sign -->
  <rect x="632" y="560" width="14" height="120" fill="#3d2b1e"/>
  <rect x="610" y="552" width="180" height="70" rx="4" fill="#e8d89b"/>
  <rect x="612" y="554" width="176" height="66" rx="2" fill="none" stroke="#7a1f1f" stroke-width="3"/>
  <text x="700" y="596" font-family="Georgia,serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#7a1f1f">LESINA</text>
  <!-- Pea: low-left, small against the water. MASS before face. -->
  <!-- body: low rounded path, head = front third -->
  <g transform="translate(170,650) scale(1)">
    <!-- low rounded body, not ellipse -->
    <path d="M -95 0 Q -100 -28 -60 -42 Q -10 -50 30 -44 Q 60 -40 75 -8 Q 80 2 70 6 Q 30 14 -40 14 Q -90 12 -95 0 Z" fill="#b07a40"/>
    <!-- head = front third, low -->
    <path d="M 38 -10 Q 55 -18 68 -12 Q 80 -4 74 14 Q 66 30 44 32 Q 24 32 18 20 Q 14 8 24 -4 Q 30 -10 38 -10 Z" fill="#c58a48"/>
    <!-- cream wedge snout, down to the rim / water -->
    <polygon points="66,-4 82,6 70,26 56,18" fill="#d9b07a"/>
    <!-- black nose at the tip -->
    <circle cx="82" cy="8" r="6" fill="#1a1208"/>
    <!-- thin red collar -->
    <rect x="40" y="26" width="22" height="8" rx="3" fill="#c0201f"/>
    <!-- two lopsided ears at different heights, touching the head -->
    <polygon points="40,-16 34,-42 52,-30" fill="#7a5233"/>
    <polygon points="62,-14 70,-48 80,-26" fill="#7a5233"/>
    <!-- eyes -->
    <circle cx="52" cy="-2" r="4" fill="#2a1a0a"/>
    <circle cx="64" cy="0" r="4" fill="#2a1a0a"/>
    <!-- four thin legs with feet -->
    <rect x="-78" y="8" width="10" height="40" fill="#9a6a38"/>
    <rect x="-38" y="12" width="10" height="44" fill="#9a6a38"/>
    <rect x="4" y="12" width="10" height="44" fill="#9a6a38"/>
    <rect x="44" y="8" width="10" height="40" fill="#9a6a38"/>
  </g>
  <!-- narrow shadow under the dog -->
  <ellipse cx="235" cy="712" rx="120" ry="22" fill="#0a0806" opacity="0.55"/>
  <!-- a big pale plate edge at the bottom-left corner — the dog's place -->
  <path d="M 40 800 A 210 210 0 0 1 400 760 L 430 790 A 250 250 0 0 0 40 800 Z" fill="#f2f0e6" opacity="0.95"/>
  <path d="M 40 800 A 210 210 0 0 1 400 760 L 430 790 A 250 250 0 0 0 40 800 Z" fill="none" stroke="#b08a5e" stroke-width="3"/>
</svg>