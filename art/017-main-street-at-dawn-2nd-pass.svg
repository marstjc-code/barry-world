<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14101a"/>
      <stop offset="0.35" stop-color="#2a1a35"/>
      <stop offset="0.65" stop-color="#4a2a4a"/>
      <stop offset="0.8" stop-color="#7a3a4a"/>
      <stop offset="0.92" stop-color="#a84a3a"/>
      <stop offset="1" stop-color="#c85a3a"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c85a3a"/>
      <stop offset="1" stop-color="#5a2a2a"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c9" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#ffc06b" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#ff9d2e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plateGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8dc" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffc06b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b3a2f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c9" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffc06b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b3a2f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="steam" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- SKY -->
  <rect x="0" y="0" width="800" height="360" fill="url(#sky)"/>
  <!-- moon — thin crescent, low on the right -->
  <path d="M 690 95 a 22 22 0 0 1 32 8 a 16 16 0 0 0 -30 0 a 14 14 0 0 1 -2 -8 z" fill="#fff6c9" opacity="0.9"/>
  <!-- stars -->
  <circle cx="90" cy="35" r="1.6" fill="#fff" opacity="0.75"/>
  <circle cx="180" cy="65" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="340" cy="40" r="1.3" fill="#fff" opacity="0.65"/>
  <circle cx="440" cy="90" r="0.9" fill="#fff" opacity="0.45"/>
  <circle cx="520" cy="30" r="1.1" fill="#fff" opacity="0.55"/>
  <circle cx="600" cy="70" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="730" cy="40" r="1.4" fill="#fff" opacity="0.7"/>
  <circle cx="780" cy="110" r="0.9" fill="#fff" opacity="0.45"/>
  <!-- faint cloud band -->
  <ellipse cx="380" cy="200" rx="140" ry="8" fill="#5a3a5a" opacity="0.35"/>
  <ellipse cx="520" cy="215" rx="100" ry="6" fill="#5a3a5a" opacity="0.25"/>
  <ellipse cx="240" cy="225" rx="90" ry="5" fill="#5a3a5a" opacity="0.2"/>

  <!-- HORIZON SILHOUETTE — building shapes breaking the sky -->
  <path d="M 0 340 L 60 340 L 60 310 L 90 310 L 90 330 L 130 330 L 130 300 L 160 300 L 160 325 L 200 325 L 200 340 Z" fill="#1a1018"/>
  <path d="M 480 340 L 520 340 L 520 315 L 550 315 L 550 330 L 600 330 L 600 305 L 640 305 L 640 325 L 680 325 L 680 340 Z" fill="#1a1018"/>
  <path d="M 720 340 L 780 340 L 780 320 L 800 320 L 800 340 Z" fill="#1a1018"/>
  <!-- a chimney -->
  <rect x="115" y="295" width="10" height="10" fill="#1a1018"/>
  <path d="M 120 295 q 4 -12 0 -22 q -3 -12 1 -24" fill="none" stroke="#1a1018" stroke-width="2" opacity="0.7"/>

  <!-- GROUND / STREET -->
  <rect x="0" y="360" width="800" height="240" fill="#2a2018"/>
  <!-- curb -->
  <rect x="0" y="360" width="800" height="5" fill="#3a2a18"/>
  <!-- street lines -->
  <line x1="0" y1="410" x2="800" y2="410" stroke="#3a3020" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#3a3020" stroke-width="2" opacity="0.35"/>
  <line x1="0" y1="530" x2="800" y2="530" stroke="#3a3020" stroke-width="2" opacity="0.25"/>

  <!-- PIE OVEN (left) -->
  <rect x="60" y="330" width="150" height="70" fill="#7a3a2a"/>
  <rect x="58" y="328" width="154" height="5" fill="#a85a3a"/>
  <rect x="85" y="342" width="62" height="38" fill="#3a2018"/>
  <rect x="88" y="345" width="56" height="32" fill="#1a1008"/>
  <rect x="178" y="295" width="26" height="40" fill="#8a4a3a"/>
  <rect x="175" y="290" width="32" height="6" fill="#a85a3a"/>
  <!-- steam -->
  <path d="M 192 290 q 8 -18 0 -32 q -6 -14 2 -28" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  <path d="M 202 290 q -6 -20 0 -34 q 4 -16 -2 -30" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  <path d="M 184 290 q 10 -16 2 -30 q -6 -12 0 -24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  <ellipse cx="192" cy="265" rx="18" ry="22" fill="url(#steam)" opacity="0.5"/>

  <!-- FOUR STREET LAMPS — different heights, slightly staggered, so they read as a street not a fence -->
  <!-- lamp 1 (taller, left) -->
  <rect x="222" y="292" width="6" height="95" fill="#1a1008"/>
  <rect x="215" y="290" width="20" height="6" fill="#1a1008"/>
  <circle cx="225" cy="287" r="9" fill="#fff6c9"/>
  <circle cx="225" cy="287" r="16" fill="url(#lampGlow)"/>
  <!-- lamp 2 (shorter) -->
  <rect x="358" y="302" width="6" height="85" fill="#1a1008"/>
  <rect x="351" y="300" width="20" height="6" fill="#1a1008"/>
  <circle cx="361" cy="297" r="8" fill="#fff6c9"/>
  <circle cx="361" cy="297" r="15" fill="url(#lampGlow)"/>
  <!-- lamp 3 (taller) -->
  <rect x="452" y="295" width="6" height="92" fill="#1a1008"/>
  <rect x="445" y="293" width="20" height="6" fill="#1a1008"/>
  <circle cx="455" cy="290" r="9" fill="#fff6c9"/>
  <circle cx="455" cy="290" r="16" fill="url(#lampGlow)"/>
  <!-- lamp 4 (shorter, right) -->
  <rect x="598" y="303" width="6" height="84" fill="#1a1008"/>
  <rect x="591" y="301" width="20" height="6" fill="#1a1008"/>
  <circle cx="601" cy="298" r="8" fill="#fff6c9"/>
  <circle cx="601" cy="298" r="15" fill="url(#lampGlow)"/>
  <!-- lamp reflections on pavement -->
  <ellipse cx="225" cy="395" rx="30" ry="9" fill="#ffc06b" opacity="0.22"/>
  <ellipse cx="361" cy="395" rx="26" ry="8" fill="#ffc06b" opacity="0.2"/>
  <ellipse cx="455" cy="395" rx="30" ry="9" fill="#ffc06b" opacity="0.22"/>
  <ellipse cx="601" cy="395" rx="26" ry="8" fill="#ffc06b" opacity="0.2"/>

  <!-- KITCHEN FRONTAGE — a building behind the street -->
  <!-- wall -->
  <rect x="180" y="330" width="440" height="35" fill="#2a1a10"/>
  <rect x="180" y="328" width="440" height="4" fill="#3a2a18"/>
  <!-- three windows with frames -->
  <!-- window 1 (left) -->
  <rect x="210" y="332" width="90" height="30" fill="#1a1008" stroke="#3a2a18" stroke-width="3"/>
  <rect x="216" y="338" width="78" height="18" fill="#0b0908"/>
  <circle cx="255" cy="348" r="12" fill="url(#windowGlow)"/>
  <ellipse cx="255" cy="350" rx="10" ry="3.5" fill="#fff8dc"/>
  <line x1="255" y1="338" x2="255" y2="356" stroke="#1a1008" stroke-width="1.5"/>
  <line x1="216" y1="347" x2="294" y2="347" stroke="#1a1008" stroke-width="1.5"/>
  <!-- window 2 (centre) -->
  <rect x="350" y="332" width="70" height="30" fill="#1a1008" stroke="#3a2a18" stroke-width="3"/>
  <rect x="356" y="338" width="58" height="18" fill="#0b0908"/>
  <circle cx="385" cy="348" r="10" fill="url(#windowGlow)" opacity="0.85"/>
  <ellipse cx="385" cy="350" rx="8" ry="3" fill="#fff8dc"/>
  <line x1="385" y1="338" x2="385" y2="356" stroke="#1a1008" stroke-width="1.5"/>
  <!-- window 3 (right) -->
  <rect x="480" y="332" width="80" height="30" fill="#1a1008" stroke="#3a2a18" stroke-width="3"/>
  <rect x="486" y="338" width="68" height="18" fill="#0b0908"/>
  <circle cx="525" cy="348" r="11" fill="url(#windowGlow)" opacity="0.8"/>
  <ellipse cx="525" cy="350" rx="9" ry="3.5" fill="#fff8dc"/>
  <line x1="525" y1="338" x2="525" y2="356" stroke="#1a1008" stroke-width="1.5"/>
  <!-- a hanging sign on the wall between windows -->
  <line x1="310" y1="332" x2="310" y2="322" stroke="#3a2a18" stroke-width="2"/>
  <rect x="298" y="315" width="24" height="14" fill="#8b3a2f" stroke="#a85a3a" stroke-width="1.5"/>
  <text x="310" y="326" font-family="Courier New,monospace" font-size="7" fill="#fff8dc" text-anchor="middle">OPEN</text>

  <!-- STEPS AT KITCHEN -->
  <rect x="200" y="363" width="130" height="9" fill="#3a2a1a"/>
  <rect x="205" y="372" width="120" height="9" fill="#2a1a0a"/>
  <rect x="210" y="381" width="110" height="9" fill="#3a2a1a"/>

  <!-- PEA — asleep, side view, proper dog shape -->
  <!-- body: a humped back, not a flat ellipse -->
  <path d="M 290 420
           q 12 -22 40 -22
           q 28 0 42 8
           q 10 6 6 14
           q -4 8 -18 10
           q -14 2 -30 -2
           q -18 -4 -24 -12
           q -4 -6 -4 -4
           z"
         fill="#b87a4a" stroke="#a86a3a" stroke-width="2"/>
  <!-- lighter belly -->
  <path d="M 300 428 q 30 4 52 0 q 8 -2 4 -10 q -4 -8 -18 -6 q -24 2 -24 16 z" fill="#c88a5a"/>
  <!-- head -->
  <path d="M 370 404 q 14 -6 24 0 q 8 4 8 10 q 0 8 -6 12 q -8 4 -16 0 q -8 -4 -10 -10 q -4 -6 0 -12 q 4 -4 10 -4 z"
        fill="#c88a5a" stroke="#a86a3a" stroke-width="2"/>
  <!-- snout -->
  <path d="M 392 408 q 8 0 10 4 q 2 4 -2 6 q -4 2 -8 0 q -4 -2 -2 -6 q 2 -4 8 -4 z" fill="#d89a6a" stroke="#a86a3a" stroke-width="1.5"/>
  <!-- nose -->
  <circle cx="402" cy="416" r="3.5" fill="#2a1a0a"/>
  <!-- closed eye -->
  <path d="M 380 412 q 4 -2 8 0" fill="none" stroke="#2a1a0a" stroke-width="1.5"/>
  <!-- ear (flopped) -->
  <path d="M 372 402 q 8 -8 14 -4 q 4 2 2 8 q -2 6 -8 4 q -6 -2 -8 -8 q -2 -6 0 -8 z" fill="#a86a3a" stroke="#8a5a2a" stroke-width="1.5"/>
  <!-- tail curled around -->
  <path d="M 290 420 q -14 4 -12 14 q 2 10 12 10 q 8 0 8 -6 q 0 -4 -4 -4"
        fill="none" stroke="#a86a3a" stroke-width="6" stroke-linecap="round"/>
  <!-- paws tucked -->
  <ellipse cx="330" cy="432" rx="8" ry="4" fill="#b87a4a" stroke="#a86a3a" stroke-width="1"/>
  <ellipse cx="355" cy="432" rx="8" ry="4" fill="#b87a4a" stroke="#a86a3a" stroke-width="1"/>
  <!-- shadow -->
  <ellipse cx="345" cy="442" rx="42" ry="7" fill="#0b0908" opacity="0.55"/>

  <!-- BIG TABLE at the foot of the kitchen -->
  <rect x="400" y="442" width="120" height="18" fill="#3a2a1a"/>
  <rect x="400" y="460" width="120" height="10" fill="#2a1a0a"/>
  <rect x="408" y="470" width="10" height="42" fill="#2a1a0a"/>
  <rect x="502" y="470" width="10" height="42" fill="#2a1a0a"/>
  <!-- table top — visible surface -->
  <rect x="398" y="436" width="124" height="10" fill="#4a3a2a"/>

  <!-- BIG PLATE on the table -->
  <ellipse cx="460" cy="448" rx="60" ry="15" fill="#fff8dc"/>
  <ellipse cx="460" cy="445" rx="55" ry="13" fill="#ffffff"/>
  <ellipse cx="460" cy="442" rx="48" ry="11" fill="#f8f0dc"/>
  <!-- pie on the plate -->
  <ellipse cx="460" cy="442" rx="32" ry="9" fill="#c08a4a"/>
  <ellipse cx="460" cy="440" rx="28" ry="7" fill="#d09a5a"/>
  <path d="M 448 442 q 6 -4 12 0 q 6 4 12 0" fill="none" stroke="#8a5a30" stroke-width="1.5"/>
  <path d="M 454 442 q 4 -3 8 0 q 4 3 8 0" fill="none" stroke="#8a5a30" stroke-width="1"/>
  <path d="M 466 442 q 4 -3 8 0 q 4 3 8 0" fill="none" stroke="#8a5a30" stroke-width="1"/>
  <!-- plate shadow -->
  <ellipse cx="460" cy="462" rx="65" ry="6" fill="#0b0908" opacity="0.45"/>

  <!-- STREET SIGN — a real post, real height, real word -->
  <rect x="680" y="390" width="5" height="150" fill="#2a1a0a"/>
  <rect x="678" y="388" width="9" height="6" fill="#2a1a0a"/>
  <!-- sign face -->
  <rect x="650" y="395" width="70" height="28" fill="#8b3a2f" stroke="#a85a3a" stroke-width="2.5"/>
  <text x="685" y="413" font-family="Courier New,monospace" font-size="12" fill="#fff8dc" text-anchor="middle" font-weight="bold">MAIN ST</text>
  <text x="685" y="424" font-family="Courier New,monospace" font-size="9" fill="#fff8dc" text-anchor="middle">AT DAWN</text>
  <!-- a second smaller sign below -->
  <rect x="650" y="430" width="70" height="16" fill="#2a1a0a" stroke="#3a2a18" stroke-width="1.5"/>
  <text x="685" y="442" font-family="Courier New,monospace" font-size="8" fill="#7a6a50" text-anchor="middle">BARRY'S KITCHEN</text>

  <!-- a second, smaller street lamp on the far left -->
  <rect x="40" y="310" width="5" height="80" fill="#1a1008"/>
  <rect x="35" y="308" width="15" height="5" fill="#1a1008"/>
  <circle cx="42" cy="305" r="7" fill="#fff6c9"/>
  <circle cx="42" cy="305" r="13" fill="url(#lampGlow)"/>
  <ellipse cx="42" cy="395" rx="22" ry="7" fill="#ffc06b" opacity="0.18"/>

  <!-- a third, smaller street lamp on the far right -->
  <rect x="730" y="312" width="5" height="78" fill="#1a1008"/>
  <rect x="725" y="310" width="15" height="5" fill="#1a1008"/>
  <circle cx="732" cy="307" r="7" fill="#fff6c9"/>
  <circle cx="732" cy="307" r="13" fill="url(#lampGlow)"/>
  <ellipse cx="732" cy="395" rx="22" ry="7" fill="#ffc06b" opacity="0.18"/>

  <!-- caption -->
  <text x="20" y="585" font-family="Courier New,monospace" font-size="11" fill="#7a6a50">MAIN STREET — 5 AM, FRI 13 NOV 2026</text>
  <text x="780" y="585" font-family="Courier New,monospace" font-size="11" fill="#7a6a50" text-anchor="end">BARRY'S KITCHEN</text>
</svg>