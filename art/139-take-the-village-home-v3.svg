  <circle cx="724" cy="150" r="18" fill="none" stroke="#b3a58a" stroke-width="2"/>
  <text x="724" y="156" font-size="12" fill="#b3a58a" text-anchor="middle">BAR</text>
  <!-- caption (clear space below the plate) -->
  <rect x="18" y="564" width="764" height="18" fill="#f5eedd"/>
  <text x="400" y="578" font-family="serif" font-size="20" fill="#2a2418" text-anchor="middle" font-weight="bold">take the village home</text>
