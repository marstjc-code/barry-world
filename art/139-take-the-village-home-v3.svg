  <rect x="206" y="390" width="12" height="12" fill="#ffc35e"/>
  <rect x="318" y="392" width="12" height="12" fill="#ffc35e"/>
  <rect x="422" y="388" width="12" height="12" fill="#ffc35e"/>
  <rect x="532" y="390" width="12" height="12" fill="#ffc35e"/>
