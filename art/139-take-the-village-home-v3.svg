<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1018"/>
      <stop offset="0.6" stop-color="#242b3e"/>
      <stop offset="1" stop-color="#2e3542"/>
    </linearGradient>
    <radialGradient id="moonhalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9c4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe9c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- cream card -->
