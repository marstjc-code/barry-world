<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barry's world</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font:15px/1.45 -apple-system,system-ui,sans-serif;color:#2a1c14}
#c{position:fixed;inset:0}
#name{position:fixed;left:16px;top:12px;font-weight:700;font-size:20px;color:#fff;text-shadow:0 1px 4px #0008}
#pbubble{position:fixed;transform:translate(-50%,-100%);background:#fff8e6;border-radius:12px;padding:6px 10px;max-width:220px;font-size:12px;box-shadow:0 2px 8px #0003;pointer-events:none;display:none}
#bubble{position:fixed;transform:translate(-50%,-100%);background:#fff;border-radius:14px;padding:8px 12px;max-width:260px;font-size:13px;box-shadow:0 2px 10px #0003;pointer-events:none}
#tip{position:fixed;background:#2a1c14;color:#fff;border-radius:8px;padding:5px 9px;font-size:12px;pointer-events:none;display:none;max-width:260px}
#panel{position:fixed;right:0;top:0;bottom:0;width:360px;max-width:92vw;background:#fffaf3;box-shadow:-4px 0 18px #0003;display:flex;flex-direction:column;transition:transform .25s}
#panel.shut{transform:translateX(100%)}
#tog{position:fixed;right:372px;top:12px;border:0;border-radius:20px;padding:8px 14px;background:#7a1f2b;color:#fff;font-weight:600;cursor:pointer;transition:right .25s}
#panel.shut~#tog{right:12px}
nav{display:flex;border-bottom:1px solid #e6d9c6;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;padding:12px 11px;font:inherit;font-weight:600;cursor:pointer;color:#8a7767;white-space:nowrap}
.card{background:#fff;border:1px solid #eadfcf;border-radius:12px;padding:10px 12px;margin:0 0 10px;white-space:normal;font-size:14px}
.card .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#7a1f2b;margin-bottom:4px}.card .hd small{font-weight:600;color:#8a7767}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;background:#f3e6d6;color:#7a1f2b;margin-left:6px}.badge.claude{background:#e3ecff;color:#2f4fa0}.badge.new{background:#7a1f2b;color:#fff}
.sum{color:#4a3a2e;margin:4px 0}.ex{color:#2a1c14;margin:6px 0 2px;white-space:pre-wrap}.more{color:#7a1f2b;cursor:pointer;font-weight:600;font-size:13px}
.thumbs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.thumbs img{width:calc(33.3% - 4px);aspect-ratio:4/3;object-fit:cover;border-radius:6px;cursor:pointer;background:#eee}.thumbs img.art{aspect-ratio:1}
.thumbs video{width:100%;border-radius:8px;margin-top:4px}
.bar{height:8px;border-radius:4px;background:#eee3d3;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:#7a1f2b}.bar.e i{background:#2f8f5b}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.btn{border:0;border-radius:8px;background:#7a1f2b;color:#fff;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}.btn.g{background:#eee3d3;color:#2a1c14}.btn.on{background:#2f8f5b}.btn.s{padding:4px 9px;font-size:12px}
.live{font-size:13px;color:#4a3a2e;white-space:normal}.live div{padding:3px 0;border-bottom:1px dashed #eee3d3}.live b{color:#7a1f2b;margin-right:6px;font-weight:600}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;margin:4px 0;white-space:pre-wrap;font-size:14px}.msg.john{background:#7a1f2b;color:#fff;margin-left:auto;border-bottom-right-radius:4px}.msg.barry{background:#fff;border:1px solid #eadfcf;border-bottom-left-radius:4px}.msg small{display:block;opacity:.7;font-size:11px;margin-top:3px}
.want{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eee3d3;white-space:normal;font-size:14px}.want.done{opacity:.5;text-decoration:line-through}.want .tx{flex:1}
.place{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eee3d3;white-space:normal}.place b{text-transform:capitalize}
#rp{position:fixed;left:16px;bottom:14px;display:flex;align-items:center;gap:8px;background:#fff8e6ee;border-radius:12px;padding:8px 12px;box-shadow:0 2px 10px #0003;font-size:13px;max-width:calc(100vw - 32px)}
#rp input{width:220px;max-width:40vw}#rp b{color:#7a1f2b;min-width:150px}#rp button{border:0;border-radius:8px;background:#7a1f2b;color:#fff;padding:5px 10px;font:inherit;font-weight:600;cursor:pointer}#rp.live b{color:#2f8f5b}
@media(max-width:600px){#rp{left:8px;right:8px;bottom:8px;flex-wrap:wrap}#rp input{width:100%;max-width:none}}
#lb{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9}#lb img{max-width:96vw;max-height:92vh;border-radius:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2f8f5b;margin-right:6px;box-shadow:0 0 0 3px #2f8f5b33}.dot.off{background:#bbb;box-shadow:none}
@media(max-width:600px){#panel{width:100vw;max-width:100vw}#tog{right:12px!important}#page{left:2vw;width:96vw;top:4vh;height:90vh}}
nav button.on{color:#7a1f2b;box-shadow:inset 0 -3px #7a1f2b}
#player{display:none;padding:8px 12px;border-top:1px solid #e6dccf;background:#fff8ee}#now{font-size:12px;font-weight:600;color:#7a1f2b;margin-bottom:4px}#au{width:100%;height:34px}
.trk{padding:9px 10px;border-radius:10px;cursor:pointer;margin-bottom:4px;white-space:normal}.trk:hover,.trk.on{background:#f3e6d6}.trk b{display:block}.trk small{color:#8a7767}
#body{flex:1;overflow:auto;padding:14px 16px;white-space:pre-wrap}
#body h2{font-size:13px;color:#7a1f2b;margin:16px 0 4px}
#say{display:flex;gap:6px;padding:10px;border-top:1px solid #e6d9c6}
#say input{flex:1;padding:9px;border:1px solid #d8c8b2;border-radius:8px;font:inherit}
#say button{border:0;border-radius:8px;background:#7a1f2b;color:#fff;padding:0 14px;font-weight:600;cursor:pointer}
#page{position:fixed;left:3vw;top:6vh;width:min(900px,calc(94vw - 380px));height:86vh;background:#fff;border-radius:12px;box-shadow:0 8px 40px #0006;display:none;flex-direction:column;overflow:hidden}
#page header{display:flex;justify-content:space-between;padding:8px 12px;background:#2a1c14;color:#fff;font-size:13px}
#page header button{border:0;background:none;color:#fff;font-size:16px;cursor:pointer}
#page iframe{flex:1;border:0}
</style>

<button id="tog">Barry's notes</button>
