<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barry's world</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font:15px/1.45 -apple-system,system-ui,sans-serif;color:#2a1c14}
#c{position:fixed;inset:0}
#name{position:fixed;left:16px;top:12px;font-weight:700;font-size:20px;color:#fff;text-shadow:0 1px 4px #0008}
#pbubble{position:fixed;transform:translate(-50%,-100%);background:#fff8e6;border-radius:12px;padding:6px 10px;max-width:220px;font-size:12px;box-shadow:0 2px 8px #0003;pointer-events:none;display:none}
#bubble{position:fixed;transform:translate(-50%,-100%);background:#fff;border-radius:14px;padding:8px 12px;max-width:260px;font-size:13px;box-shadow:0 2px 10px #0003;pointer-events:none}
#tip{position:fixed;background:#2a1c14;color:#fff;border-radius:8px;padding:5px 9px;font-size:12px;pointer-events:none;display:none;max-width:260px}
#panel{position:fixed;right:0;top:0;bottom:0;width:360px;max-width:92vw;background:#fffaf3;box-shadow:-4px 0 18px #0003;display:flex;flex-direction:column;transition:transform .25s}
#panel.shut{transform:translateX(100%)}
#tog{position:fixed;right:372px;top:12px;border:0;border-radius:20px;padding:8px 14px;background:#7a1f2b;color:#fff;font-weight:600;cursor:pointer;transition:right .25s}
#panel.shut~#tog{right:12px}
nav{display:flex;border-bottom:1px solid #e6d9c6}
nav button{flex:1;border:0;background:none;padding:12px 4px;font:inherit;font-weight:600;cursor:pointer;color:#8a7767}
nav button.on{color:#7a1f2b;box-shadow:inset 0 -3px #7a1f2b}
#player{display:none;padding:8px 12px;border-top:1px solid #e6dccf;background:#fff8ee}#now{font-size:12px;font-weight:600;color:#7a1f2b;margin-bottom:4px}#au{width:100%;height:34px}
.trk{padding:9px 10px;border-radius:10px;cursor:pointer;margin-bottom:4px;white-space:normal}.trk:hover,.trk.on{background:#f3e6d6}.trk b{display:block}.trk small{color:#8a7767}
#body{flex:1;overflow:auto;padding:14px 16px;white-space:pre-wrap}
#body h2{font-size:13px;color:#7a1f2b;margin:16px 0 4px}
#say{display:flex;gap:6px;padding:10px;border-top:1px solid #e6d9c6}
#say input{flex:1;padding:9px;border:1px solid #d8c8b2;border-radius:8px;font:inherit}
#say button{border:0;border-radius:8px;background:#7a1f2b;color:#fff;padding:0 14px;font-weight:600;cursor:pointer}
#page{position:fixed;left:3vw;top:6vh;width:min(900px,calc(94vw - 380px));height:86vh;background:#fff;border-radius:12px;box-shadow:0 8px 40px #0006;display:none;flex-direction:column;overflow:hidden}
#page header{display:flex;justify-content:space-between;padding:8px 12px;background:#2a1c14;color:#fff;font-size:13px}
#page header button{border:0;background:none;color:#fff;font-size:16px;cursor:pointer}
#page iframe{flex:1;border:0}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<canvas id="c"></canvas><div id="name"></div><div id="bubble"></div><div id="pbubble"></div><div id="tip"></div>
<div id="page"><header><span id="ptitle"></span><button id="pclose" aria-label="Close page">✕</button></header><iframe id="pframe" sandbox="allow-scripts"></iframe></div>
<aside id="panel"><nav><button data-t="diary" class="on">Diary</button><button data-t="wants">Wants</button><button data-t="pages">Pages</button><button data-t="music">Music</button></nav>
<div id="body"></div>
<div id="player"><div id="now"></div><audio id="au" controls preload="none"></audio></div>
<form id="say"><input id="msg" placeholder="Say something to Barry…" aria-label="Message to Barry"><button>Send</button></form></aside>
<button id="tog">Barry's notes</button>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=s=>document.querySelector(s);
const renderer=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});renderer.shadowMap.enabled=true;renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,800);cam.position.set(14,11,18);
const ctl=new OrbitControls(cam,renderer.domElement);ctl.maxPolarAngle=1.5;ctl.target.set(0,1,0);ctl.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a7a60,1.5));
const sun=new THREE.DirectionalLight(0xfff1d6,2.2);sun.position.set(30,45,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,far:160});scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(160,72),new THREE.MeshStandardMaterial({color:'#7fae6b'}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const built=new THREE.Group();scene.add(built);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
function label(text,w){const cv=document.createElement('canvas');cv.width=512;cv.height=128;const x=cv.getContext('2d');
  x.fillStyle='#fffaf3';x.fillRect(0,0,512,128);x.fillStyle='#2a1c14';x.textAlign='center';x.textBaseline='middle';
  let f=64;do{x.font=`700 ${f}px system-ui`;f-=4}while(x.measureText(text).width>480&&f>16);x.fillText(text,256,66);
  return new THREE.Mesh(new THREE.PlaneGeometry(w,w/4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),side:THREE.DoubleSide}));}
function make(o){const g=new THREE.Group();let m;const{w,h,d}=o;
  if(o.shape==='cylinder')m=new THREE.Mesh(new THREE.CylinderGeometry(w/2,w/2,h,28),mat(o.color));
  else if(o.shape==='sphere'){m=new THREE.Mesh(new THREE.SphereGeometry(.5,28,20),mat(o.color));m.scale.set(w,h,d)}
  else if(o.shape==='cone')m=new THREE.Mesh(new THREE.ConeGeometry(w/2,h,28),mat(o.color));
  else if(o.shape==='path'){m=new THREE.Mesh(new THREE.BoxGeometry(w,.04,d),mat(o.color));m.position.y=.02-h/2}
  else if(o.shape==='tree'){m=new THREE.Mesh(new THREE.CylinderGeometry(w*.08,w*.11,h*.45,10),mat('#6b4a2f'));m.position.y=-h*.275;
    const top=new THREE.Mesh(new THREE.IcosahedronGeometry(w*.5,1),mat(o.color));top.scale.y=h*.65/w;top.position.y=h*.17;top.castShadow=true;g.add(top)}
  else if(o.shape==='lamp'){m=new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,h,8),mat('#333'));
    const b=new THREE.Mesh(new THREE.SphereGeometry(Math.max(w,.3)/2,16,12),new THREE.MeshStandardMaterial({color:o.color,emissive:o.color,emissiveIntensity:1.6}));b.position.y=h/2;g.add(b);
    const pl=new THREE.PointLight(o.color,6,14);pl.position.y=h/2;g.add(pl)}
  else if(o.shape==='sign'){m=new THREE.Mesh(new THREE.BoxGeometry(w,h,.1),mat(o.color));
    const a=label(o.label||o.id,w*.94);a.position.z=.06;g.add(a);const b=a.clone();b.rotation.y=Math.PI;b.position.z=-.06;g.add(b)}
  else m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(o.color));
  m.castShadow=m.receiveShadow=true;g.add(m);
  g.position.set(o.x,(o.y||0)+h/2,o.z);g.rotation.y=-(o.rot||0)*Math.PI/180;g.traverse(c=>c.userData.o=o);return g}
let W={objects:[]},stamp='';
async function loadWorld(){const t=await (await fetch('world.json')).text();if(t===stamp)return;stamp=t;W=JSON.parse(t);
  built.clear();W.objects.forEach(o=>{try{built.add(make(o))}catch(e){console.warn(o.id,e)}});
  scene.background=new THREE.Color(W.sky);scene.fog=new THREE.Fog(W.sky,90,260);ground.material.color.set(W.ground);$('#name').textContent=W.name;petSync()}
// Barry himself
const B=new THREE.Group();const add=(geo,c,x,y,z,sx=1,sy=1,sz=1)=>{const m=new THREE.Mesh(geo,mat(c));m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;B.add(m);return m};
add(new THREE.CylinderGeometry(.42,.5,1,20),'#f7f4ee',0,.95,0);            // jacket
add(new THREE.BoxGeometry(.62,.75,.06),'#7a1f2b',0,.8,.46);                // apron
add(new THREE.SphereGeometry(.3,24,18),'#e8b592',0,1.72,0);                // bald head
add(new THREE.SphereGeometry(.07,10,8),'#d99a7c',0,1.68,.3);               // nose
const mo=(s)=>{const m=add(new THREE.TorusGeometry(.13,.045,8,16,Math.PI),'#2b1a12',s*.13,1.6,.27);m.rotation.z=Math.PI+s*.35;return m};mo(1);mo(-1);
[-.11,.11].forEach(x=>add(new THREE.SphereGeometry(.035,8,8),'#1a1a1a',x,1.78,.27));
const legs=[-.17,.17].map(x=>add(new THREE.CylinderGeometry(.11,.11,.5,10),'#2d2d33',x,.25,0));
const arms=[-.52,.52].map(x=>add(new THREE.CylinderGeometry(.09,.09,.6,10),'#f7f4ee',x,1.05,0));
scene.add(B);
// Barry's pet (appears once he adopts one)
const P=new THREE.Group();P.visible=false;scene.add(P);let pgoal=new THREE.Vector3(),ppause=0,plegs=[],ptail=null,pkey='';
function buildPet(p){P.clear();const c=p.color||'#b5651d',bird=/bird|duck|hen|chicken|goose|parrot|pigeon|gull|owl|crow|magpie|turkey|penguin/i.test(p.animal);
  const pm=(geo,col,x,y,z,sx=1,sy=1,sz=1)=>{const m=new THREE.Mesh(geo,mat(col));m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;P.add(m);return m};
  if(bird){pm(new THREE.SphereGeometry(.2,16,12),c,0,.34,0,1,1.1,1.3);pm(new THREE.SphereGeometry(.12,14,10),c,0,.62,.14);
    const b=pm(new THREE.ConeGeometry(.045,.14,8),'#e8a23a',0,.6,.3);b.rotation.x=Math.PI/2;
    plegs=[-.07,.07].map(x=>pm(new THREE.CylinderGeometry(.02,.02,.2,6),'#e8a23a',x,.1,0));ptail=pm(new THREE.ConeGeometry(.08,.2,8),c,0,.38,-.3);ptail.rotation.x=-1.2}
  else{pm(new THREE.SphereGeometry(.2,16,12),c,0,.36,0,1,.95,1.7);pm(new THREE.SphereGeometry(.15,14,10),c,0,.56,.36);
    pm(new THREE.SphereGeometry(.07,10,8),'#2a1c14',0,.52,.5,1,.8,1);[-.09,.09].forEach(x=>pm(new THREE.ConeGeometry(.055,.14,8),c,x,.72,.33));
    plegs=[[-.11,.2],[.11,.2],[-.11,-.2],[.11,-.2]].map(([x,z])=>pm(new THREE.CylinderGeometry(.04,.04,.24,8),c,x,.12,z));
    ptail=pm(new THREE.CylinderGeometry(.025,.035,.3,6),c,0,.5,-.38);ptail.rotation.x=-.9}
  [-.06,.06].forEach(x=>pm(new THREE.SphereGeometry(.022,6,6),'#111',x,bird?.66:.61,bird?.24:.48));
  const tag=label(p.name,1.4);tag.position.set(0,1.05,0);P.add(tag)}
function petSync(){const p=W.pet;if(!p){P.visible=false;return}const k=p.name+p.animal+p.color;if(k!==pkey){pkey=k;buildPet(p);P.position.set(p.x,0,p.z)}
  P.visible=true;pgoal.set(p.x,0,p.z);$('#pbubble').textContent=(p.sound?p.sound+' ':'')+(p.doing||'')}
let goal=new THREE.Vector3(2,0,2),pause=0;
function pick(){if(W.objects.length&&Math.random()<.8){const o=W.objects[Math.random()*W.objects.length|0];const r=Math.max(o.w,o.d)/2+1.2,a=Math.random()*6.28;goal.set(o.x+Math.cos(a)*r,0,o.z+Math.sin(a)*r)}
  else goal.set((Math.random()-.5)*16,0,(Math.random()-.5)*16)}
// bubble + panel
let diary='',wants='',tab='diary',said='';
async function loadNotes(){diary=await (await fetch('diary.md')).text().catch(()=>'');wants=await (await fetch('wants.md')).text().catch(()=>'');
  const last=diary.split(/\n## /).pop().split('\n').slice(1).join(' ').trim();said=last.length>150?last.slice(0,150)+'…':last;$('#bubble').textContent=said||'…';show()}
let TR=[],PL={name:"Barry's Records",order:[],notes:{}},cur=-1;
async function loadMusic(){try{TR=await (await fetch('music/tracks.json',{cache:'no-store'})).json()}catch(e){TR=[]}try{PL=await (await fetch('music/playlist.json',{cache:'no-store'})).json()}catch(e){}
  if(PL.order&&PL.order.length){const m=Object.fromEntries(TR.map(t=>[t.file,t]));TR=PL.order.map(f=>m[f]).filter(Boolean)}if(tab==='music')show()}
function play(i){if(!TR.length)return;cur=(i+TR.length)%TR.length;const t=TR[cur],au=$('#au');$('#player').style.display='block';$('#now').textContent='♪ '+t.title;au.src='music/'+t.file;au.play().catch(()=>{});if(tab==='music')show()}
$('#au').onended=()=>play(cur+1);
function show(){const b=$('#body');
  if(tab==='music'){b.innerHTML='';const h=document.createElement('h2');h.textContent=(PL.name||"Barry's Records")+' · '+TR.length+' track'+(TR.length===1?'':'s');b.append(h);
    if(!TR.length){b.append('No records yet.');return}
    TR.forEach((t,i)=>{const d=document.createElement('div');d.className='trk'+(i===cur?' on':'');const n=document.createElement('b');n.textContent=(i+1)+'. '+t.title;const s=document.createElement('small');
      s.textContent=((PL.notes||{})[t.file]||t.style||'')+(t.date?' · '+t.date:'');d.append(n,s);d.onclick=()=>play(i);b.append(d)});return}
  if(tab==='pages'){b.innerHTML='';const ls=[...new Set(W.objects.filter(o=>o.link).map(o=>o.link))];
    b.textContent=ls.length?'':'No pages hung up in the world yet.';ls.forEach(l=>{const a=document.createElement('a');a.href='#';a.textContent=l;a.style.display='block';a.onclick=e=>{e.preventDefault();openPage(l)};b.append(a)});return}
  const src=(tab==='diary'?diary.split(/\n(?=## )/).slice(1).reverse().join('\n'):wants)||'Nothing yet.';
  b.innerHTML='';src.split('\n').forEach(l=>{const e=document.createElement(l.startsWith('## ')?'h2':'div');e.textContent=l.replace(/^#+ /,'');b.append(e)})}
document.querySelectorAll('nav button').forEach(x=>x.onclick=()=>{tab=x.dataset.t;document.querySelectorAll('nav button').forEach(y=>y.classList.toggle('on',y===x));show()});
$('#tog').onclick=()=>$('#panel').classList.toggle('shut');
$('#say').onsubmit=async e=>{e.preventDefault();const t=$('#msg').value.trim();if(!t)return;await fetch('/say',{method:'POST',body:JSON.stringify({text:t})});$('#msg').value='';$('#msg').placeholder='Left for Barry. He reads it when he next wakes.'};
function openPage(l){if(!/^pages\/[\w.-]+$/.test(l))return;$('#pframe').src=l;$('#ptitle').textContent=l;$('#page').style.display='flex'}
$('#pclose').onclick=()=>{$('#page').style.display='none';$('#pframe').src='about:blank'};
// hover + click
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let hov=null;
function hit(e){mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,cam);const h=ray.intersectObjects(built.children,true)[0];return h&&h.object.userData.o}
addEventListener('pointermove',e=>{if(e.target!==renderer.domElement){$('#tip').style.display='none';return}hov=hit(e);const t=$('#tip');
  if(hov&&(hov.label||hov.note||hov.link)){t.style.display='block';t.style.left=e.clientX+14+'px';t.style.top=e.clientY+14+'px';t.textContent=[hov.label||hov.id,hov.note,hov.link?'(click to open)':''].filter(Boolean).join(' · ')}else t.style.display='none';
  renderer.domElement.style.cursor=hov&&hov.link?'pointer':''});
let down=null;renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<5){const o=hit(e);if(o&&o.link)openPage(o.link)}});
function size(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
const clock=new THREE.Clock(),v=new THREE.Vector3();
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.1),t=clock.elapsedTime;
  const to=v.copy(goal).sub(B.position);to.y=0;const dist=to.length();
  if(dist>.15){to.normalize();B.position.addScaledVector(to,dt*1.3);B.rotation.y=Math.atan2(to.x,to.z);const s=Math.sin(t*9)*.5;legs[0].rotation.x=s;legs[1].rotation.x=-s;arms[0].rotation.x=-s;arms[1].rotation.x=s}
  else{legs.concat(arms).forEach(l=>l.rotation.x*=.8);pause-=dt;if(pause<0){pause=2+Math.random()*5;pick()}}
  B.position.y=Math.abs(Math.sin(t*9))*(dist>.15?.04:0);
  if(P.visible){const pt=v.copy(pgoal).sub(P.position);pt.y=0;const pd=pt.length();
    if(pd>.12){pt.normalize();P.position.addScaledVector(pt,dt*1.9);P.rotation.y=Math.atan2(pt.x,pt.z);const s=Math.sin(t*14)*.6;plegs.forEach((l,i)=>l.rotation.x=i%2?s:-s)}
    else{plegs.forEach(l=>l.rotation.x*=.8);ppause-=dt;if(ppause<0&&W.pet){ppause=3+Math.random()*6;const a=Math.random()*6.28,r=Math.random()*1.6;pgoal.set(W.pet.x+Math.cos(a)*r,0,W.pet.z+Math.sin(a)*r)}}
    if(ptail)ptail.rotation.z=Math.sin(t*10)*.5;P.position.y=Math.abs(Math.sin(t*14))*(pd>.12?.05:0)}
  ctl.update();renderer.render(scene,cam);
  {const q=v.set(P.position.x,1.3,P.position.z).project(cam),pb=$('#pbubble');pb.style.display=P.visible&&q.z<1?'block':'none';pb.style.left=(q.x+1)/2*innerWidth+'px';pb.style.top=(1-q.y)/2*innerHeight+'px'}
  const p=v.set(B.position.x,2.25,B.position.z).project(cam),bb=$('#bubble');bb.style.display=p.z<1&&said?'block':'none';bb.style.left=(p.x+1)/2*innerWidth+'px';bb.style.top=(1-p.y)/2*innerHeight+'px'});
const Q=new URLSearchParams(location.search);
if(Q.has('shot')){['#panel','#tog','#name','#tip'].forEach(s=>{const e=$(s);if(e)e.style.display='none'});if(!Q.has('bubbles')){const st=document.createElement('style');st.textContent='#bubble,#pbubble{display:none!important}';document.head.append(st)}
  const n=k=>(Q.get(k)||'').split(',').map(Number);if(Q.has('cam'))cam.position.set(...n('cam'));if(Q.has('look'))ctl.target.set(...n('look'));
  if(Q.has('orbit')){ctl.autoRotate=true;ctl.autoRotateSpeed=Number(Q.get('orbit'))||4}
  if(Q.has('follow'))setInterval(()=>{ctl.target.lerp(B.position.clone().setY(1.2),.08)},50)}
if(/github\.io$/.test(location.hostname)){$('#say').style.display='none'}
await loadWorld();await loadNotes();pick();window.READY=true;loadMusic();setInterval(()=>{loadWorld();loadNotes();loadMusic()},20000);
</script></body></html>
