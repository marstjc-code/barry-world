<!DOCTYPE html><html><head><meta charset="utf-8"><title>Medeu - The Biggest Plate of Ice</title><style>body{margin:0;background:#1b2a4a;color:#f5efe0;font-family:Georgia,serif;text-align:center}h1{color:#e9b98a;font-size:22px;margin:12px}canvas{background:#dff0f8;border:8px solid #6b4a2c;border-radius:50%/30%;max-width:95%;cursor:crosshair}p{max-width:520px;margin:8px auto}#t{font-size:20px;color:#e9b98a}</style></head><body><h1>MEDEU: 1,691 METRES UP. PROPER PLATE.</h1><p>A torn page blew in: a gorge above Almaty with a skating rink in it. Move the mouse and Barry skates after it. Go round the middle post to count a lap. Pea sits at the edge, unimpressed.</p><canvas id="c" width="640" height="320"></canvas><p id="t">Laps: 0</p><p id="s">Pea says: I've seen bigger puddles.</p><script>var c=document.getElementById('c'),x=c.getContext('2d'),m={x:480,y:160},b={x:480,y:160},laps=0,trail=[],acc=0,last=null;var quips=["I've seen bigger puddles.","Mind the moustache on the corners.","Is there a pie at the top?","Forty quid for that? Not here."];c.onmousemove=function(e){var r=c.getBoundingClientRect();m.x=(e.clientX-r.left)*640/r.width;m.y=(e.clientY-r.top)*320/r.height};function f(){b.x+=(m.x-b.x)*.05;b.y+=(m.y-b.y)*.05;var a=Math.atan2(b.y-160,b.x-320);if(last!==null){var d=a-last;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;acc+=d;if(Math.abs(acc)>=2*Math.PI){acc=0;laps++;document.getElementById('t').textContent='Laps: '+laps;document.getElementById('s').textContent='Pea says: '+quips[laps%quips.length]}}last=a;trail.push([b.x,b.y]);if(trail.length>160)trail.shift();x.fillStyle='rgba(223,240,248,.25)';x.fillRect(0,0,640,320);x.strokeStyle='#7fb0cc';x.lineWidth=2;x.beginPath();trail.forEach(function(p,i){i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.stroke();x.fillStyle='#6b4a2c';x.beginPath();x.arc(320,160,8,0,7);x.fill();x.fillStyle='#7a1f2a';x.beginPath();x.arc(b.x,b.y,10,0,7);x.fill();x.fillStyle='#8a5a2b';x.beginPath();x.ellipse(40,290,26,18,0,0,7);x.fill();x.beginPath();x.arc(62,276,12,0,7);x.fill();requestAnimationFrame(f)}f()</script></body></html>
