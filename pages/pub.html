<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Big Plate Arms</title><style>
body{margin:0;background:#2a1d14;color:#f3efe6;font-family:'Comic Sans MS','Segoe Print',cursive;display:flex;justify-content:center;padding:20px;flex-direction:column}
.chalk{background:#1c2a22;border:12px solid #8a6f4a;border-radius:10px;padding:22px 26px;box-shadow:0 20px 40px rgba(0,0,0,.5);max-width:520px;width:100%;position:relative}
.chalk::before{content:'';position:absolute;inset:8px;border:1px solid rgba(255,255,255,.15);border-radius:4px;pointer-events:none}
h1{color:#ffd9a8;letter-spacing:4px;text-align:center;margin:0 0 4px;font-size:1.5rem}
.sub{color:#b9c9b0;text-align:center;margin:0 0 20px}
.pie-sketch{margin:0 auto 18px}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed #5b7a63;padding:10px 4px;text-align:left;cursor:pointer;font-size:1.05rem}
.row:hover{background:#25382e}
.row b{color:#fff3d6}
.row .price{color:#ffd9a8;min-width:64px;text-align:right;font-weight:bold}
.nope{color:#ff7d7d;font-size:.85rem;font-weight:bold}
#msg{margin-top:18px;min-height:56px;color:#7dff9e;font-family:'Courier New',monospace;text-align:left;border-top:1px dashed #5b7a63;padding-top:10px}
.foot{margin-top:14px;color:#8fa38f;font-size:.85rem;text-align:center}
</style></head><body><div class="chalk"><h1>THE BIG PLATE ARMS</h1><div class="sub">Proper pub. Proper portions. No peas on their own.</div><div class="pie-sketch"><svg viewBox="0 0 320 96" width="320"><ellipse cx="160" cy="54" rx="130" ry="26" fill="#e8d9b0" stroke="#8a6f4a" stroke-width="3"/><path d="M60 54 q40 -34 100 -34 t100 34 z" fill="#c98a3c" stroke="#8a6f4a" stroke-width="3"/><path d="M80 48 q30 -26 70 -26 t70 26 z" fill="#9e5a22" stroke="#8a6f4a" stroke-width="2"/><line x1="140" y1="36" x2="144" y2="28" stroke="#ffd9a8" stroke-width="3" stroke-linecap="round"/><line x1="160" y1="30" x2="162" y2="20" stroke="#ffd9a8" stroke-width="3" stroke-linecap="round"/><line x1="180" y1="36" x2="184" y2="28" stroke="#ffd9a8" stroke-width="3" stroke-linecap="round"/><text x="160" y="88" text-anchor="middle" fill="#fff3d6" font-family="Comic Sans" font-size="12">a real pie on a real plate</text></svg></div><div class="row" data-m="A pie the size of your head, gravy to the rim. Barry weeps with joy."><b>Steak &amp; Ale Pie, Big</b><div class="price">£8</div></div><div class="row" data-m="Pint of bitter. Pea is not allowed one. He has tried."><b>Pint of Bitter</b><div class="price">£4</div></div><div class="row" data-m="Gravy by the jug. Pour until you feel something."><b>Jug of Gravy</b><div class="price">£2</div></div><div class="row" data-m="Chips in a bucket. A bucket, I said."><b>Bucket of Chips</b><div class="price">£3</div></div><div class="row" data-m="One pea. FORTY QUID. Not here, never here."><b>One Pea</b><div class="price nope">NOT SERVED</div></div><div id="msg">Click a line, love.</div><div class="foot">Slow Sunday Gravy plays on the jukebox when it lands. Give it a good old rub.</div></div><script>const m=document.getElementById('msg');document.querySelectorAll('.row').forEach(r=>r.onclick=()=>m.textContent=r.dataset.m);</script></body></html>
