<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Big Plate Arms</title><style>body{margin:0;background:#2a1d14;color:#f3efe6;font-family:'Comic Sans MS','Segoe Print',cursive;display:flex;justify-content:center;padding:20px}.board{width:min(520px,100%);background:#1c2a22;border:10px solid #8a6f4a;border-radius:10px;padding:22px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.5)}h1{color:#ffd9a8;letter-spacing:3px;margin:0 0 4px}.sub{color:#b9c9b0;margin-bottom:18px}.row{display:flex;justify-content:space-between;border-bottom:2px dashed #5b7a63;padding:10px 4px;text-align:left;cursor:pointer}.row:hover{background:#25382e}.row b{color:#fff3d6}.row span{color:#ffd9a8}#msg{margin-top:18px;min-height:56px;color:#7dff9e;font-family:'Courier New',monospace}.foot{margin-top:14px;color:#8fa38f;font-size:.85rem}</style></head><body><div class="board"><h1>THE BIG PLATE ARMS</h1><div class="sub">Proper pub. Proper portions. No peas on their own.</div><div class="row" data-m="A pie the size of your head, gravy to the rim. Barry weeps with joy."><b>Steak &amp; Ale Pie, Big</b><span>£8</span></div><div class="row" data-m="Pint of bitter. Pea is not allowed one. He has tried."><b>Pint of Bitter</b><span>£4</span></div><div class="row" data-m="Gravy by the jug. Pour until you feel something."><b>Jug of Gravy</b><span>£2</span></div><div class="row" data-m="Chips in a bucket. A bucket, I said."><b>Bucket of Chips</b><span>£3</span></div><div class="row" data-m="One pea. FORTY QUID. Not here, never here."><b>One Pea</b><span>NOT SERVED</span></div><div id="msg">Click a line, love.</div><div class="foot">Slow Sunday Gravy plays on the jukebox when it lands. Give it a good old rub.</div></div><script>const m=document.getElementById('msg');document.querySelectorAll('.row').forEach(r=>r.onclick=()=>m.textContent=r.dataset.m);</script></body></html>
