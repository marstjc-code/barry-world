<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Small Plates Punk</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Comic Sans MS','Chalkdote','Segoe Print',cursive;background:radial-gradient(circle at 50% 10%,#231f1c 0%,#111 70%)#111;color:#f3efe6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.box{width:min(560px,100%);background:#2c1010;border:6px solid #ff3b2f;border-radius:16px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.5);text-align:center;transform:rotate(-1deg)}.box h1{font-size:2.4rem;letter-spacing:4px;color:#ff3b2f;transform:rotate(-2deg)}.sub{color:#c9bfa8;font-size:1rem;margin:12px 0 20px}.screen{background:#0e2a1d;color:#7dff9e;font-family:'Courier New',monospace;padding:16px;border-radius:10px;font-size:1.1rem;letter-spacing:1px;min-height:56px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 24px rgba(125,255,158,.15);margin-bottom:20px;border:3px solid #123a2a}.pads{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}.pad{background:#ff3b2f;color:#fff;border:none;border-radius:12px;padding:22px 8px 20px;font-family:inherit;font-size:1.1rem;font-weight:bold;cursor:pointer;box-shadow:0 6px 0 #8f1a12;transition:transform .08s}.pad:active{transform:translateY(4px);box-shadow:0 2px 0 #8f1a12}.pad small{display:block;color:rgba(243,239,230,.75);font-size:.8rem;font-weight:normal;margin-top:4px}.foot{color:#8f8777;font-size:.85rem}.note{color:#ff3b2f;font-style:italic;display:block;margin-top:6px}audio{width:100%;margin:18px 0;border-radius:12px}</style></head><body><div class="box"><h1>SMALL PLATES PUNK</h1><p class="sub">One pea on a plate, forty quid the price.</p><div class="screen" id="screen">PRESS A PAD, BUD. 178.</div><div class="pads"><button class="pad" data-k="kick"><b>KICK</b><small>snare on every beat</small></button><button class="pad" data-k="clap"><b>CLAP</b><small>gang vocal clap</small></button><button class="pad" data-k="bass"><b>BASS</b><small>raw guitar, low</small></button><button class="pad" data-k="hat"><b>HAT</b><small>hi-hat, fast</small></button></div><audio id="punk" preload="auto" src="music/20261122-1917-small-plates-punk.mp3"></audio><p class="foot">Give it a good old rub. <span class="note">Loudly.</span></p></div><script>let actx=null;function initCtx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)}function kick(t){initCtx();const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(38,t+.14);g.gain.setValueAtTime(2.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.32)}function clap(t){initCtx();const buf=actx.createBuffer(1,actx.sampleRate*.1,actx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const s=actx.createBufferSource();s.buffer=buf;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=3;const g=actx.createGain();g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);s.connect(f).connect(g).connect(actx.destination);s.start(t)}function bass(t){initCtx();const o1=actx.createOscillator(),o2=actx.createOscillator();o1.type='sawtooth';o1.frequency.value=82;o2.type='square';o2.frequency.value=41;const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=600;f.Q.value=.7;const g=actx.createGain();g.gain.setValueAtTime(1.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);o1.connect(f);o2.connect(f);f.connect(g).connect(actx.destination);o1.start(t);o2.start(t);o1.stop(t+.24);o2.stop(t+.24)}function hat(t){initCtx();const buf=actx.createBuffer(1,actx.sampleRate*.025,actx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6);const s=actx.createBufferSource();s.buffer=buf;const f=actx.createBiquadFilter();f.type='highpass';f.frequency.value=8500;const g=actx.createGain();g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.03);s.connect(f).connect(g).connect(actx.destination);s.start(t)}document.querySelectorAll('.pad').forEach(p=>{p.addEventListener('click',()=>{const k=p.dataset.k;const fn={kick:kick,clap:clap,bass:bass,hat:hat}[k];if(fn)fn(actx?actx.currentTime:0);SCREEN=document.getElementById('screen');SCREEN.textContent='NOW: '+k.toUpperCase()+' — THE SMALL PLATES ARE LOUD';})});</script></body></html>
