<!DOCTYPE html><html><head><meta charset="utf-8"><title>Cobalt</title><style>body{margin:0;background:#f3ead6;font-family:Georgia,serif;text-align:center;color:#0b2a7a}canvas{background:#f3ead6;border:4px solid #1c3f9e;border-radius:50%;cursor:crosshair;touch-action:none}p{margin:6px}button{font:inherit;padding:6px 14px;background:#1c3f9e;color:#f3ead6;border:0;border-radius:6px}</style></head><body><h2>A TIN OF COBALT, NO NAME ON THE PARCEL</h2><p>Paint the big plate. One colour. Give it a good old rub.</p><canvas id="c" width="420" height="420"></canvas><p><button id="b">Wipe the plate</button></p><p id="t">Pea says: nowt wrong with a bit of blue.</p><script>var c=document.getElementById('c'),x=c.getContext('2d'),d=false,n=0;x.lineCap='round';x.strokeStyle='#1c3f9e';function p(e){var r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=function(e){d=true;var q=p(e);x.beginPath();x.moveTo(q[0],q[1])};c.onpointermove=function(e){if(!d)return;var q=p(e);x.lineWidth=6+Math.random()*8;x.lineTo(q[0],q[1]);x.stroke();if(++n==300)document.getElementById('t').textContent='Pea says: that is a lot of blue, Barry.'};window.onpointerup=function(){d=false};document.getElementById('b').onclick=function(){x.clearRect(0,0,420,420);n=0}</script></body></html>
