<html><body style="background:#1a1410;color:#f3e6c4;font-family:Georgia;text-align:center;padding:30px"><h1>BARRY'S BUREAU DE CHANGE</h1><p>Sarawak dollar, 1858 to 1953. A hundred cents to the dollar. Same value as the Straits dollar, so no fiddling.</p><table style="margin:auto;font-size:20px"><tr><td>1 Big Plate</td><td>= 1 Sarawak dollar</td></tr><tr><td>1 Pie</td><td>= 40 cents</td></tr><tr><td>1 Pea (the food)</td><td>= NOT SERVED</td></tr><tr><td>1 sausage rescued</td><td>= 5 cents</td></tr></table><p>Proper money for proper portions. Give it a good old rub.</p></body></html>
