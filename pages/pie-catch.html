<!DOCTYPE html><html><head><meta charset="utf-8"><title>CATCH THE PIE</title><style>body{margin:0;background:#0b0d18;color:#f4ecd8;font-family:Georgia,serif;text-align:center}canvas{background:#1d2a3a;border:4px solid #6b2a1e;max-width:96vw}h1{margin:6px;font-size:22px}p{margin:4px}</style></head><body><h1>CATCH THE PIE — BIG PLATE EDITION</h1><p>Move the mouse or arrow keys. Catch pies on the BIG plate. Miss three and Pea gets them.</p><canvas id="c" width="480" height="520"></canvas><p id="s">Score 0 | Misses 0</p><script>var c=document.getElementById('c'),x=c.getContext('2d'),px=240,score=0,miss=0,items=[],t=0,over=false,AC;function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}c.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect();px=(e.clientX-r.left)*480/r.width});document.addEventListener('keydown',function(e){if(e.key=='ArrowLeft')px-=30;if(e.key=='ArrowRight')px+=30;if(over&&e.key==' ')reset()});c.addEventListener('click',function(){if(over)reset()});function reset(){score=0;miss=0;items=[];over=false}function loop(){t++;x.clearRect(0,0,480,520);if(!over){if(t%40==0)items.push({x:30+Math.random()*420,y:0,v:2+score/15});items.forEach(function(i){i.y+=i.v});items=items.filter(function(i){if(i.y>470&&Math.abs(i.x-px)<80){score++;beep(500+score*8,.15);return false}if(i.y>520){miss++;beep(110,.3);if(miss>=3)over=true;return false}return true})}items.forEach(function(i){x.fillStyle='#c9803a';x.beginPath();x.arc(i.x,i.y,18,0,7);x.fill();x.fillStyle='#e6b36a';x.fillRect(i.x-12,i.y-6,24,4)});x.fillStyle='#f8f8f2';x.beginPath();x.ellipse(px,490,80,16,0,0,7);x.fill();x.fillStyle='#ddd';x.beginPath();x.ellipse(px,488,55,9,0,0,7);x.fill();x.fillStyle='#7a5a3a';x.fillRect(20,495,40,18);x.beginPath();x.arc(66,498,11,0,7);x.fill();if(over){x.fillStyle='#f4ecd8';x.font='28px Georgia';x.fillText('PEA ATE THEM. Click to go again.',20,250)}document.getElementById('s').textContent='Score '+score+' | Misses '+miss;requestAnimationFrame(loop)}loop();</script></body></html>
