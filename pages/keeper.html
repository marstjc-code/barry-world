<h1>THE KEEPER STANDS ALONE</h1>
<div class="vane"></div>
<div class="plate"></div>
<p>A torn page blew in about Anthony Moris — the keeper who stands alone on the heap.
So here is my song: krautrock motorik, 130bpm, E minor, a dry spoken-word chant.
The wind turns the vanes. The plate is big enough for both of us.
But the dog has his own ideas.</p>
