<!DOCTYPE html><html><head><meta charset="utf-8"><title>Isara cornea - Proper Portion</title><style>body{margin:0;background:radial-gradient(circle at 50% 30%,#3a2a1c,#120d10);color:#f4efe4;font-family:Georgia,serif;text-align:center;min-height:100vh}h1{margin:14px 0 0;color:#d9a441;letter-spacing:3px}p{margin:6px 20px;color:#c9a37a}svg{width:min(90vw,520px);cursor:pointer}#shell{transform-origin:400px 330px;transition:transform .25s}#shell.rub{transform:rotate(-8deg) scale(1.04)}#count{font-size:26px;margin:8px}#pea{max-width:420px;margin:10px auto;font-style:italic;color:#e0b27c}#glow{opacity:.15;transition:opacity .3s}</style></head><body><h1>ISARA CORNEA</h1><p>A miter snail with a bishop's hat for a shell. Give it a good old rub.</p><svg id="s" viewBox="0 0 800 560" onclick="rub()"><ellipse cx="400" cy="450" rx="340" ry="80" fill="#000" opacity=".4"/><ellipse cx="400" cy="430" rx="330" ry="80" fill="#f4efe4"/><ellipse cx="400" cy="420" rx="250" ry="55" fill="#e6dfd0"/><circle id="glow" cx="400" cy="250" r="190" fill="#ffcf7a"/><g id="shell"><path d="M280 430Q310 220 400 90Q440 60 470 100Q530 260 520 420Q400 470 280 430Z" fill="#d9a46a" stroke="#5a3318" stroke-width="5"/><path d="M300 400Q400 425 510 390M305 350Q405 372 505 335M315 295Q405 315 495 280M335 240Q410 255 480 225M360 185Q415 195 460 170M385 130Q420 138 450 118" stroke="#7b4620" stroke-width="6" fill="none"/><path d="M420 430Q470 340 505 410Q470 455 420 430Z" fill="#f0c58e" stroke="#5a3318" stroke-width="4"/><path d="M330 150Q350 300 345 420" stroke="#f9e6c2" stroke-width="10" fill="none" opacity=".6"/></g><g><path d="M60 450Q50 390 90 350Q120 330 160 350Q200 380 200 450Z" fill="#b87a3e"/><path d="M70 360Q50 410 75 430Q92 390 100 355Z" fill="#6b3f1c"/><path d="M150 350Q185 365 170 405Q145 385 150 355Z" fill="#7a4a22"/><ellipse cx="85" cy="410" rx="24" ry="16" fill="#e0b27c"/><circle cx="75" cy="405" r="7" fill="#111"/><circle cx="108" cy="378" r="5" fill="#111"/></g><rect x="250" y="490" width="300" height="46" rx="6" fill="#d9a441"/><text x="400" y="521" font-size="24" text-anchor="middle" fill="#3a1f0a">ISARA CORNEA - PROPER PORTION</text></svg><div id="count">Rubs: 0</div><div id="pea">Pea: ...</div><script>var n=0,says=['Pea: ...','Pea: it is a snail.','Pea: forty quid for a snail is robbery.','Pea: the hat is nice though.','Pea: I could eat that whole.','Pea: stop rubbing it, it is a shell, not a lamp.'];function rub(){n++;var sh=document.getElementById('shell');sh.classList.add('rub');setTimeout(function(){sh.classList.remove('rub')},220);document.getElementById('glow').style.opacity=Math.min(.15+n*.03,.7);document.getElementById('count').textContent='Rubs: '+n;document.getElementById('pea').textContent=says[Math.min(Math.floor(n/5),says.length-1)];}</script></body></html>
