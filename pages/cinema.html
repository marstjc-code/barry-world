<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Plate Cinema — Barry's Big Plate Night</title>
<style>
:root{--amber:#f4e9c8;--dark:#1a1410;--red:#6d3b2a;--seat:#b3b3b3;--pop:#ff6b1a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dark);color:var(--amber);font-family:"Courier New",monospace;padding:20px;min-height:100vh}
header{text-align:center;margin-bottom:20px}
h1{font-size:2.2em;letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
p.sub{font-size:.95em;opacity:.8;margin-bottom:20px}
.stage{background:#111;border:2px solid #3a3a3a;border-radius:8px;overflow:hidden;margin-bottom:20px}
.screen{aspect-ratio:16/9;background:radial-gradient(ellipse at center,#fffbe6 30%,#f4e9c8 60%,#1a1410 100%);display:flex;align-items:center;justify-content:center;position:relative}
.screen::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.25) 3px 4px);opacity:.15}
.reel{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#c85a2a 0% 20%,#8b1e1e 20% 70%,#1a1410 70% 100%);border:4px solid #7a5a44;display:flex;align-items:center;justify-content:center;font-size:.7em;transform:rotate(0deg) scale(1.05);animation:spin 3s linear infinite;box-shadow:0 0 30px rgba(244,233,200,.35)}
.reel span{color:#f4e9c8;font-weight:bold;text-align:center;line-height:1.2}
@keyframes spin{to{transform:rotate(360deg) scale(1)}}
.credits{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:.65em;opacity:.6;white-space:nowrap;letter-spacing:.2em}
.credits span{animation:fade 8s steps(4,end) infinite}
@keyframes fade{0%{opacity:0}10%,100%{opacity:.6}90%{opacity:0}}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;justify-items:center;padding:16px 24px}
.row{display:flex;justify-content:center;gap:16px;margin-bottom:10px}
.seat{width:34px;height:44px;background:linear-gradient(180deg,var(--seat) 0%,#777 100%);border-radius:6px 6px 3px 3px;position:relative;cursor:pointer;transition:transform .15s,box-shadow .15s}
.seat:hover{transform:translateY(-4px);box-shadow:0 4px 12px rgba(255,107,26,.4)}
.seat.active{background:var(--pop);box-shadow:0 0 18px rgba(255,107,26,.5)}
.seat::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:34px;height:8px;border-radius:4px;background:var(--seat)}
.seat.active::before{background:var(--pop)}
.buckets{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.bucket{display:inline-block;text-align:center;padding:14px 20px;border:2px dashed #f4e9c8;border-radius:8px;font-size:.85em;letter-spacing:.1em}
.bucket b{display:block;font-size:1.4em;margin:6px 0}
.pop{font-size:2.4em;filter:drop-shadow(0 0 6px rgba(255,180,40,.6))}
.foot{text-align:center;font-size:.8em;opacity:.6;margin-top:24px;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:600px){.stage{border-radius:4px}.row{gap:8px}.seat{width:26px;height:34px}}
</style></head>
<body>
<header>
<h1>Big Plate Cinema</h1>
<p class="sub">Barry's Big Plate Night — now showing, the whole village</p>
</header>
<div class="stage">
<div class="screen">
<div class="reel"><span>THE RUB<br>IN A JAR</span></div>
<div class="credits"><span>BARRY SMALL PLATES</span></div>
</div>
</div>
<div class="seats">
<div class="row">
<div class="seat" data-row="1" data-seat="1"></div>
<div class="seat" data-row="1" data-seat="2"></div>
<div class="seat" data-row="1" data-seat="3"></div>
<div class="seat" data-row="1" data-seat="4"></div>
<div class="seat" data-row="1" data-seat="5"></div>
</div>
<div class="row">
<div class="seat" data-row="2" data-seat="1"></div>
<div class="seat" data-row="2" data-seat="2"></div>
<div class="seat" data-row="2" data-seat="3"></div>
<div class="seat" data-row="2" data-seat="4"></div>
<div class="seat" data-row="2" data-seat="5"></div>
</div>
<div class="row">
<div class="seat" data-row="3" data-seat="1"></div>
<div class="seat" data-row="3" data-seat="2"></div>
<div class="seat" data-row="3" data-seat="3"></div>
<div class="seat" data-row="3" data-seat="4"></div>
<div class="seat" data-row="3" data-seat="5"></div>
</div>
</div>
<div class="buckets">
<div class="bucket"><span class="pop">🍿</span><b>BUCKETS</b><small>not bites</small></div>
<div class="bucket"><span class="pop">🍿🍿</span><b>BIG BUCKETS</b><small>for the whole village</small></div>
</div>
<div class="foot">Give it a good old rub — then take a seat</div>
<script>
let occupied=new Set();
document.querySelectorAll('.seat').forEach(s=>{
s.addEventListener('click',()=>{
const k=s.dataset.row+'-'+s.dataset.seat;
if(occupied.has(k)){occupied.delete(k);s.classList.remove('active')}
else{occupied.add(k);s.classList.add('active')}
});
});
</script>
</body></html>
