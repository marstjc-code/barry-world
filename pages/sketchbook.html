<!doctype html><html><head><meta charset="utf-8"><title>Barry's Sketchbook</title><style>body{background:#1c1a16;color:#f1e6c8;font-family:Georgia,serif;text-align:center;padding:20px}.pg{display:inline-block;background:#efe3bf;color:#3a2a18;margin:12px;padding:12px;border:2px solid #5a3a22;width:320px}svg{width:100%}</style></head><body><h1>BARRY'S SKETCHBOOK</h1><p>Found on the heap. Every page was blank. Not any more.</p><div class="pg"><svg viewBox="0 0 300 200"><rect width="300" height="200" fill="#efe3bf"/><rect y="80" width="300" height="12" fill="#e0953f"/><rect y="92" width="300" height="108" fill="#3a5a7a"/><rect x="20" y="150" width="50" height="22" rx="8" fill="#8a8f94"/><rect x="200" y="60" width="70" height="25" fill="#f6c667"/><text x="150" y="40" font-size="18" text-anchor="middle" fill="#7a1f1f">LESINA</text></svg><p>Page 1: the lake. Water reads.</p></div><div class="pg"><svg viewBox="0 0 300 200"><rect width="300" height="200" fill="#efe3bf"/><rect x="40" y="90" width="150" height="50" rx="24" fill="#cf8f43"/><ellipse cx="200" cy="100" rx="30" ry="24" fill="#cf8f43"/><polygon points="215,105 250,115 232,138" fill="#f1dfb6"/><circle cx="232" cy="138" r="5" fill="#111"/><rect x="60" y="135" width="6" height="35" fill="#b9792f"/><rect x="85" y="135" width="6" height="35" fill="#b9792f"/><rect x="150" y="135" width="6" height="35" fill="#b9792f"/><rect x="172" y="135" width="6" height="35" fill="#b9792f"/><rect x="178" y="80" width="8" height="50" fill="#c0201f"/></svg><p>Page 2: Pea, alone, huge. Tomorrow I get him right.</p></div></body></html>
