<!DOCTYPE html><html><head><meta charset="utf-8"><title>The South Sea Bubble</title><style>body{margin:0;background:#2a1f2b;color:#f3e6c0;font-family:Georgia,serif;text-align:center}h1{margin:12px 0 0}#c{background:linear-gradient(#2a1f2b,#5a3a2a);border:3px solid #8a7440;max-width:96vw}button{font:20px Georgia;padding:10px 18px;margin:6px;background:#8a1a1a;color:#f3e6c0;border:0;border-radius:6px}.cert{display:inline-block;background:#efe2b8;color:#4a3a1a;padding:10px 20px;transform:rotate(-2deg);border:2px solid #8a7440}</style></head><body><h1>THE SOUTH SEA BUBBLE</h1><p>Buy a share. Blow the bubble. Sell before it pops. Mister Blunt already has.</p><canvas id="c" width="640" height="420"></canvas><div><button id="blow">BLOW (+£4)</button><button id="sell">SELL!</button></div><div class="cert" id="cert">Share price: £40 · Wallet: £0</div><p id="msg">Pea says: hollow.</p><audio controls src="music/20261127-1217-the-bubble-goes-pop.mp3"></audio><script>var c=document.getElementById('c'),g=c.getContext('2d'),price=40,wallet=0,r=40,limit=100+Math.random()*120,popped=false,t=0;function msg(s){document.getElementById('msg').textContent=s}function cert(){document.getElementById('cert').textContent='Share price: £'+Math.round(price)+' · Wallet: £'+Math.round(wallet)}document.getElementById('blow').onclick=function(){if(popped)return;r+=12;price+=4+Math.random()*6;cert();if(r>limit){popped=true;price=0;msg('POP. Nothing inside. Forty quid of air. Give it a good old rub.');cert()}else msg('Bigger! Mister Blunt is nodding.')};document.getElementById('sell').onclick=function(){if(popped){reset();return}wallet+=price;msg('Sold at £'+Math.round(price)+'. You walk off before the pop. Pea approves.');reset()};function reset(){popped=false;r=40;price=40;limit=100+Math.random()*120;cert()}function draw(){t+=0.03;g.clearRect(0,0,640,420);g.fillStyle='#6b4630';g.fillRect(0,330,640,90);g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(320,385,240,40,0,0,7);g.fill();g.fillStyle='#e9e4d6';g.beginPath();g.ellipse(320,370,240,40,0,0,7);g.fill();g.fillStyle='#f8f5ea';g.beginPath();g.ellipse(320,366,190,28,0,0,7);g.fill();if(!popped){var y=350-r+Math.sin(t)*3,gr=g.createRadialGradient(320-r*.3,y-r*.3,r*.1,320,y,r);gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(.4,'rgba(191,227,242,.4)');gr.addColorStop(1,'rgba(74,143,176,.6)');g.fillStyle=gr;g.strokeStyle='#d8f0fa';g.lineWidth=3;g.beginPath();g.arc(320,y,r,0,7);g.fill();g.stroke()}else{g.fillStyle='#8a1a1a';g.font='bold 40px Georgia';g.fillText('HOLLOW',230,300)}requestAnimationFrame(draw)}draw();cert();</script></body></html>
