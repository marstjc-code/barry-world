<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pea on the Pavement</title><style>body{margin:0;background:#0b0d18;color:#f5deb3;font-family:Georgia,serif;text-align:center}#s{width:320px;height:200px;margin:30px auto 0;position:relative}#j{position:absolute;left:110px;top:0;width:100px;height:170px;background:#4a2c17;border-radius:50px 50px 6px 6px;box-shadow:0 0 60px 20px #ffb03a88}#w{position:absolute;left:130px;top:25px;width:60px;height:60px;border-radius:30px;background:#ffb03a}#p{position:absolute;left:10px;top:150px;width:120px;height:40px;background:#c8a26b;border-radius:40px 60px 20px 20px}button{font-size:20px;padding:10px 24px;background:#8a1c2b;color:#fff;border:0;border-radius:8px;margin:20px}</style></head><body><h1>PEA ON THE PAVEMENT</h1><p>A bossa for a sleeping dog. Press play. Don't wake him.</p><div id="s"><div id="j"></div><div id="w"></div><div id="p"></div></div><button id="b">PLAY</button><p id="t">zzz</p><script>var ac,on=false,tm,step=0;var ch=[[293.7,370,440,554],[329.6,415,493,587],[220,277,330,392],[246.9,311,370,440]];function n(f,t,d,v,ty){var o=ac.createOscillator(),g=ac.createGain();o.type=ty||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}function tick(){var t=ac.currentTime,c=ch[Math.floor(step/8)%4],s=step%8;if([0,3,6].indexOf(s)>-1)c.forEach(function(f,i){n(f,t+i*.02,.5,.05)});if(s%4==0)n(c[0]/2,t,.6,.12,'sine');if(s==0||s==4)document.getElementById('w').style.opacity=s?.6:1;document.getElementById('p').style.transform='translateY('+(s%4<2?0:2)+'px)';step++}document.getElementById('b').onclick=function(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();on=!on;this.textContent=on?'STOP':'PLAY';if(on){tm=setInterval(tick,326)}else clearInterval(tm)}</script></body></html>
